name: GSI Release Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

env:
  SOURCE_API_URL: "https://api.github.com/repos/Doze-off/ProjectInfinity-X_gsi/releases"
  WORK_DIR: ${{ github.workspace }}/gsi_work

permissions:
  contents: read

jobs:
  check_and_compare:
    name: Check release and compare images
    runs-on: ubuntu-latest
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils p7zip-full jq curl
        
      - name: Fetch latest release
        id: fetch
        run: |
          mkdir -p ${{ env.WORK_DIR }}
          curl -fsSL "${{ env.SOURCE_API_URL }}" -o "${{ env.WORK_DIR }}/releases.json"
          
          LATEST_RELEASE=$(jq -r '.[0]' "${{ env.WORK_DIR }}/releases.json")
          
          if [[ "$LATEST_RELEASE" == "null" ]]; then
            echo "::error::No releases found"
            exit 1
          fi
          
          RELEASE_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          
          VANILLA_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("VANILLA")) | .browser_download_url' | head -1)
          GAPPS_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("GAPPS")) | .browser_download_url' | head -1)
          
          if [[ -z "$VANILLA_URL" || -z "$GAPPS_URL" ]]; then
            echo "::error::Required assets not found"
            exit 1
          fi
          
          echo "vanilla_url=$VANILLA_URL" >> $GITHUB_OUTPUT
          echo "gapps_url=$GAPPS_URL" >> $GITHUB_OUTPUT
          
          echo "Found release: $RELEASE_TAG"
          
      - name: Download VANILLA
        run: |
          mkdir -p ${{ env.WORK_DIR }}/downloads
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/vanilla.img.xz" \
            "${{ steps.fetch.outputs.vanilla_url }}"
          
      - name: Download GAPPS
        run: |
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/gapps.img.xz" \
            "${{ steps.fetch.outputs.gapps_url }}"
          
      - name: Extract VANILLA
        run: |
          VANILLA_OUT="${{ env.WORK_DIR }}/extracted/vanilla"
          mkdir -p "$VANILLA_OUT"
    
          xz -d "${{ env.WORK_DIR }}/downloads/vanilla.img.xz"
          set +e
          7z x "${{ env.WORK_DIR }}/downloads/vanilla.img" -o"$VANILLA_OUT"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi
          echo "VANILLA_EXTRACTED=$VANILLA_OUT" >> $GITHUB_ENV

      - name: Extract GAPPS
        run: |
          GAPPS_OUT="${{ env.WORK_DIR }}/extracted/gapps"
          mkdir -p "$GAPPS_OUT"
    
          xz -d "${{ env.WORK_DIR }}/downloads/gapps.img.xz"
          set +e
          7z x "${{ env.WORK_DIR }}/downloads/gapps.img" -o"$GAPPS_OUT"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi
          echo "GAPPS_EXTRACTED=$GAPPS_OUT" >> $GITHUB_ENV

      - name: Check locations and list files
        run: |
          echo "## Current working directory" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          pwd >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          echo "## VANILLA location" >> $GITHUB_STEP_SUMMARY
          echo "Path: $VANILLA_EXTRACTED" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -la "$VANILLA_EXTRACTED" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          echo "## GAPPS location" >> $GITHUB_STEP_SUMMARY
          echo "Path: $GAPPS_EXTRACTED" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -la "$GAPPS_EXTRACTED" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate file lists
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          # Create sorted file lists with relative paths
          find vanilla -type f | sort > ${{ env.WORK_DIR }}/vanilla_files.txt
          find gapps -type f | sort > ${{ env.WORK_DIR }}/gapps_files.txt
          
          # Create sorted directory lists with relative paths
          find vanilla -type d | sort > ${{ env.WORK_DIR }}/vanilla_dirs.txt
          find gapps -type d | sort > ${{ env.WORK_DIR }}/gapps_dirs.txt
          
          echo "Generated file and directory lists with relative paths"

      - name: Show structural differences
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          echo "## Structural differences (diff -qr)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
          diff -qr vanilla gapps >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
      - name: Generate comparison report
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          echo "# GSI Image Comparison: VANILLA vs GAPPS" > ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "Release: ${{ steps.fetch.outputs.release_tag }}" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "Comparison date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          echo "## Paths" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "- Working directory: \`${{ env.WORK_DIR }}/extracted\`" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "- VANILLA: \`vanilla/\`" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "- GAPPS: \`gapps/\`" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          echo "## Summary Statistics" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "| Type | VANILLA | GAPPS |" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "|------|---------|-------|" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "| Files | $(wc -l < ${{ env.WORK_DIR }}/vanilla_files.txt) | $(wc -l < ${{ env.WORK_DIR }}/gapps_files.txt) |" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "| Directories | $(wc -l < ${{ env.WORK_DIR }}/vanilla_dirs.txt) | $(wc -l < ${{ env.WORK_DIR }}/gapps_dirs.txt) |" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          diff -qr vanilla gapps > ${{ env.WORK_DIR }}/full_diff.txt 2>&1 || true
          
          echo "## Files Added in GAPPS" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          TOTAL_ADDED=$(comm -13 ${{ env.WORK_DIR }}/vanilla_files.txt ${{ env.WORK_DIR }}/gapps_files.txt | wc -l)
          echo "**Total added files:** $TOTAL_ADDED" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          if [[ $TOTAL_ADDED -gt 0 ]]; then
            echo "\`\`\`diff" >> ${{ env.WORK_DIR }}/comparison_report.md
            comm -13 ${{ env.WORK_DIR }}/vanilla_files.txt ${{ env.WORK_DIR }}/gapps_files.txt | \
              sed 's/^/+ /' | head -200 >> ${{ env.WORK_DIR }}/comparison_report.md
            echo "\`\`\`" >> ${{ env.WORK_DIR }}/comparison_report.md
          fi
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          echo "## Files Removed in GAPPS" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          TOTAL_REMOVED=$(comm -23 ${{ env.WORK_DIR }}/vanilla_files.txt ${{ env.WORK_DIR }}/gapps_files.txt | wc -l)
          echo "**Total removed files:** $TOTAL_REMOVED" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          if [[ $TOTAL_REMOVED -gt 0 ]]; then
            echo "\`\`\`diff" >> ${{ env.WORK_DIR }}/comparison_report.md
            comm -23 ${{ env.WORK_DIR }}/vanilla_files.txt ${{ env.WORK_DIR }}/gapps_files.txt | \
              sed 's/^/- /' | head -200 >> ${{ env.WORK_DIR }}/comparison_report.md
            echo "\`\`\`" >> ${{ env.WORK_DIR }}/comparison_report.md
          fi
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          echo "## Directory Differences" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          echo "### Directories added in GAPPS" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "\`\`\`diff" >> ${{ env.WORK_DIR }}/comparison_report.md
          comm -13 ${{ env.WORK_DIR }}/vanilla_dirs.txt ${{ env.WORK_DIR }}/gapps_dirs.txt | \
            sed 's/^/+ /' | head -100 >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "\`\`\`" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          echo "### Directories removed in GAPPS" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "\`\`\`diff" >> ${{ env.WORK_DIR }}/comparison_report.md
          comm -23 ${{ env.WORK_DIR }}/vanilla_dirs.txt ${{ env.WORK_DIR }}/gapps_dirs.txt | \
            sed 's/^/- /' | head -100 >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "\`\`\`" >> ${{ env.WORK_DIR }}/comparison_report.md

      - name: Show filtered structural differences
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          echo "## Filtered structural differences" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Filter:** Only \`system/\`, \`system_ext/\`, \`product/\` - excluding \`build.prop\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
          grep -E '(system/|system_ext/|product/)' ${{ env.WORK_DIR }}/full_diff.txt | grep -v 'build\.prop' >> $GITHUB_STEP_SUMMARY || echo "No differences found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          grep -E '(system/|system_ext/|product/)' ${{ env.WORK_DIR }}/full_diff.txt | grep -v 'build\.prop' > ${{ env.WORK_DIR }}/filtered_diff.txt || true
          
      - name: Upload filtered diff
        uses: actions/upload-artifact@v4
        with:
          name: filtered-diff-${{ steps.fetch.outputs.release_tag }}
          path: ${{ env.WORK_DIR }}/filtered_diff.txt
          retention-days: 30
          
      - name: Display summary
        run: |
          echo "## Comparison Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release: ${{ steps.fetch.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Report uploaded as artifact" >> $GITHUB_STEP_SUMMARY
