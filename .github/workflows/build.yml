name: GSI Release Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

env:
  SOURCE_API_URL: "https://api.github.com/repos/Doze-off/ProjectInfinity-X_gsi/releases"
  WORK_DIR: ${{ github.workspace }}/gsi_work

permissions:
  contents: read

jobs:
  check_release:
    name: Stage 1 - Check latest release
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check.outputs.release_exists }}
      vanilla_url: ${{ steps.check.outputs.vanilla_url }}
      gapps_url: ${{ steps.check.outputs.gapps_url }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      
    steps:
      - name: Fetch releases from GitHub API
        id: fetch
        run: |
          mkdir -p ${{ env.WORK_DIR }}
          curl -fsSL "${{ env.SOURCE_API_URL }}" -o "${{ env.WORK_DIR }}/releases.json"
          
          if [[ ! -s "${{ env.WORK_DIR }}/releases.json" ]]; then
            echo "::error::Failed to fetch releases or empty response"
            exit 1
          fi
          
      - name: Find latest release with required assets
        id: check
        run: |
          RELEASES_JSON="${{ env.WORK_DIR }}/releases.json"
          
          LATEST_RELEASE=$(jq -r '.[0]' "$RELEASES_JSON")
          
          if [[ "$LATEST_RELEASE" == "null" ]]; then
            echo "::error::No releases found"
            echo "release_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          RELEASE_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          
          VANILLA_ASSET=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("VANILLA")) | .browser_download_url' | head -1)
          GAPPS_ASSET=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("GAPPS")) | .browser_download_url' | head -1)
          
          if [[ -n "$VANILLA_ASSET" && -n "$GAPPS_ASSET" ]]; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "vanilla_url=$VANILLA_ASSET" >> $GITHUB_OUTPUT
            echo "gapps_url=$GAPPS_ASSET" >> $GITHUB_OUTPUT
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
      - name: Display release info
        if: steps.check.outputs.release_exists == 'true'
        run: |
          echo "### Stage 1 completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "Release tag: ${{ steps.check.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY

  download_assets:
    name: Stage 2 - Download VANILLA and GAPPS
    runs-on: ubuntu-latest
    needs: check_release
    if: needs.check_release.outputs.release_exists == 'true'
    
    steps:
      - name: Prepare environment
        run: |
          mkdir -p ${{ env.WORK_DIR }}/downloads
          mkdir -p ${{ env.WORK_DIR }}/extracted
          
      - name: Download VANILLA
        run: |
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/vanilla.img.xz" \
            "${{ needs.check_release.outputs.vanilla_url }}"
          
          ls -la "${{ env.WORK_DIR }}/downloads/vanilla.img.xz"
          
          if [[ -s "${{ env.WORK_DIR }}/downloads/vanilla.img.xz" ]]; then
            echo "VANILLA downloaded successfully"
          else
            echo "::error::Failed to download VANILLA"
            exit 1
          fi
          
      - name: Download GAPPS
        run: |
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/gapps.img.xz" \
            "${{ needs.check_release.outputs.gapps_url }}"
          
          ls -la "${{ env.WORK_DIR }}/downloads/gapps.img.xz"
          
          if [[ -s "${{ env.WORK_DIR }}/downloads/gapps.img.xz" ]]; then
            echo "GAPPS downloaded successfully"
          else
            echo "::error::Failed to download GAPPS"
            exit 1
          fi
          
      - name: Verify downloads with ls -la
        run: |
          echo "## Downloads completed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -la ${{ env.WORK_DIR }}/downloads/ >> $GITHUB_STEP_SUMMARY
          pwd >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  extract_images:
    name: Stage 3 - Extract images
    runs-on: ubuntu-latest
    needs: download_assets
    if: needs.check_release.outputs.release_exists == 'true'
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils p7zip-full
          
      - name: Extract VANILLA with xz and 7z
        run: |
          VANILLA_OUT="${{ env.WORK_DIR }}/extracted/vanilla"
          mkdir -p "$VANILLA_OUT"
          
          xz -d "${{ env.WORK_DIR }}/downloads/vanilla.img.xz"
          
          ls -la "${{ env.WORK_DIR }}/downloads/"
          
          if [[ -f "${{ env.WORK_DIR }}/downloads/vanilla.img" ]]; then
            7z x "${{ env.WORK_DIR }}/downloads/vanilla.img" -o"$VANILLA_OUT" > /dev/null
            echo "VANILLA_EXTRACTED=$VANILLA_OUT" >> $GITHUB_ENV
            echo "VANILLA extracted successfully"
            ls -la "$VANILLA_OUT"
          else
            echo "::error::xz decompression failed for VANILLA"
            exit 1
          fi
          
      - name: Extract GAPPS with xz and 7z
        run: |
          GAPPS_OUT="${{ env.WORK_DIR }}/extracted/gapps"
          mkdir -p "$GAPPS_OUT"
          
          xz -d "${{ env.WORK_DIR }}/downloads/gapps.img.xz"
          
          ls -la "${{ env.WORK_DIR }}/downloads/"
          
          if [[ -f "${{ env.WORK_DIR }}/downloads/gapps.img" ]]; then
            7z x "${{ env.WORK_DIR }}/downloads/gapps.img" -o"$GAPPS_OUT" > /dev/null
            echo "GAPPS_EXTRACTED=$GAPPS_OUT" >> $GITHUB_ENV
            echo "GAPPS extracted successfully"
            ls -la "$GAPPS_OUT"
          else
            echo "::error::xz decompression failed for GAPPS"
            exit 1
          fi
          
      - name: List extracted contents with ls -la
        run: |
          echo "## VANILLA extracted contents" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -la "${{ env.VANILLA_EXTRACTED }}" >> $GITHUB_STEP_SUMMARY 2>&1
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          echo "## GAPPS extracted contents" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -la "${{ env.GAPPS_EXTRACTED }}" >> $GITHUB_STEP_SUMMARY 2>&1
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  compare_images:
    name: Stage 4 - Compare VANILLA vs GAPPS
    runs-on: ubuntu-latest
    needs: extract_images
    if: needs.check_release.outputs.release_exists == 'true'
    
    steps:
      - name: Generate file tree with ls -laR
        run: |
          ls -laR "${{ env.VANILLA_EXTRACTED }}" > "${{ env.WORK_DIR }}/vanilla_tree.txt"
          ls -laR "${{ env.GAPPS_EXTRACTED }}" > "${{ env.WORK_DIR }}/gapps_tree.txt"
          
      - name: Extract only file paths from tree
        run: |
          grep -E '^[-l]' "${{ env.WORK_DIR }}/vanilla_tree.txt" | \
            awk '{for(i=9;i<=NF;i++) printf "%s ", $i; print ""}' | \
            sed 's/ ->.*//' | sed 's/ $//' | sort > "${{ env.WORK_DIR }}/vanilla_files.txt"
          
          grep -E '^[-l]' "${{ env.WORK_DIR }}/gapps_tree.txt" | \
            awk '{for(i=9;i<=NF;i++) printf "%s ", $i; print ""}' | \
            sed 's/ ->.*//' | sed 's/ $//' | sort > "${{ env.WORK_DIR }}/gapps_files.txt"
          
      - name: Extract directory structure
        run: |
          grep -E '^d' "${{ env.WORK_DIR }}/vanilla_tree.txt" | \
            awk '{for(i=9;i<=NF;i++) printf "%s ", $i; print ""}' | \
            sed 's/ $//' | sort > "${{ env.WORK_DIR }}/vanilla_dirs.txt"
          
          grep -E '^d' "${{ env.WORK_DIR }}/gapps_tree.txt" | \
            awk '{for(i=9;i<=NF;i++) printf "%s ", $i; print ""}' | \
            sed 's/ $//' | sort > "${{ env.WORK_DIR }}/gapps_dirs.txt"
          
      - name: Extract symlinks
        run: |
          grep -E '^l' "${{ env.WORK_DIR }}/vanilla_tree.txt" | \
            sed -n 's/.*-> //p' | sort > "${{ env.WORK_DIR }}/vanilla_links.txt"
          
          grep -E '^l' "${{ env.WORK_DIR }}/gapps_tree.txt" | \
            sed -n 's/.*-> //p' | sort > "${{ env.WORK_DIR }}/gapps_links.txt"
          
      - name: Generate diff report
        run: |
          echo "# GSI Image Comparison: VANILLA vs GAPPS" > ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "Release: ${{ needs.check_release.outputs.release_tag }}" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "Comparison date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          echo "## Summary Statistics" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "| Type | VANILLA | GAPPS |" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "|------|---------|-------|" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "| Files | $(wc -l < ${{ env.WORK_DIR }}/vanilla_files.txt) | $(wc -l < ${{ env.WORK_DIR }}/gapps_files.txt) |" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "| Directories | $(wc -l < ${{ env.WORK_DIR }}/vanilla_dirs.txt) | $(wc -l < ${{ env.WORK_DIR }}/gapps_dirs.txt) |" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "| Symlinks | $(wc -l < ${{ env.WORK_DIR }}/vanilla_links.txt) | $(wc -l < ${{ env.WORK_DIR }}/gapps_links.txt) |" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
      - name: Find added files
        run: |
          TOTAL_ADDED=$(comm -13 ${{ env.WORK_DIR }}/vanilla_files.txt ${{ env.WORK_DIR }}/gapps_files.txt | wc -l)
          
          echo "## Files Added in GAPPS" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "**Total added files:** $TOTAL_ADDED" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          if [[ $TOTAL_ADDED -gt 0 ]]; then
            echo "\`\`\`diff" >> ${{ env.WORK_DIR }}/comparison_report.md
            comm -13 ${{ env.WORK_DIR }}/vanilla_files.txt ${{ env.WORK_DIR }}/gapps_files.txt | \
              sed 's/^/+ /' | head -200 >> ${{ env.WORK_DIR }}/comparison_report.md
            echo "\`\`\`" >> ${{ env.WORK_DIR }}/comparison_report.md
          fi
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
      - name: Find removed files
        run: |
          TOTAL_REMOVED=$(comm -23 ${{ env.WORK_DIR }}/vanilla_files.txt ${{ env.WORK_DIR }}/gapps_files.txt | wc -l)
          
          echo "## Files Removed in GAPPS" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "**Total removed files:** $TOTAL_REMOVED" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          if [[ $TOTAL_REMOVED -gt 0 ]]; then
            echo "\`\`\`diff" >> ${{ env.WORK_DIR }}/comparison_report.md
            comm -23 ${{ env.WORK_DIR }}/vanilla_files.txt ${{ env.WORK_DIR }}/gapps_files.txt | \
              sed 's/^/- /' | head -200 >> ${{ env.WORK_DIR }}/comparison_report.md
            echo "\`\`\`" >> ${{ env.WORK_DIR }}/comparison_report.md
          fi
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
      - name: Find directory differences
        run: |
          echo "## Directory Differences" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          echo "### Directories added in GAPPS" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "\`\`\`diff" >> ${{ env.WORK_DIR }}/comparison_report.md
          comm -13 ${{ env.WORK_DIR }}/vanilla_dirs.txt ${{ env.WORK_DIR }}/gapps_dirs.txt | \
            sed 's/^/+ /' | head -100 >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "\`\`\`" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "" >> ${{ env.WORK_DIR }}/comparison_report.md
          
          echo "### Directories removed in GAPPS" >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "\`\`\`diff" >> ${{ env.WORK_DIR }}/comparison_report.md
          comm -23 ${{ env.WORK_DIR }}/vanilla_dirs.txt ${{ env.WORK_DIR }}/gapps_dirs.txt | \
            sed 's/^/- /' | head -100 >> ${{ env.WORK_DIR }}/comparison_report.md
          echo "\`\`\`" >> ${{ env.WORK_DIR }}/comparison_report.md
          
      - name: Display summary
        run: |
          echo "## Comparison Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          head -50 ${{ env.WORK_DIR }}/comparison_report.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full report available in artifacts" >> $GITHUB_STEP_SUMMARY
          
      - name: Upload comparison report
        uses: actions/upload-artifact@v7
        with:
          name: gsi-comparison-report-${{ needs.check_release.outputs.release_tag }}
          path: ${{ env.WORK_DIR }}/comparison_report.md
          retention-days: 30
          
      - name: Upload raw file lists
        uses: actions/upload-artifact@v7
        with:
          name: gsi-raw-lists-${{ needs.check_release.outputs.release_tag }}
          path: |
            ${{ env.WORK_DIR }}/vanilla_tree.txt
            ${{ env.WORK_DIR }}/gapps_tree.txt
            ${{ env.WORK_DIR }}/vanilla_files.txt
            ${{ env.WORK_DIR }}/gapps_files.txt
            ${{ env.WORK_DIR }}/vanilla_dirs.txt
            ${{ env.WORK_DIR }}/gapps_dirs.txt
          retention-days: 7
