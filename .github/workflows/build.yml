name: gapps-to-vanilla

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., 2026-06-07) - leave empty for latest'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xz-utils wget p7zip-full jq
        
        git clone https://github.com/anestisb/android-simg2img.git
        cd android-simg2img
        make
        sudo cp simg2img img2simg /usr/local/bin/
        cd ..
    
    - name: Get release assets
      id: get_assets
      run: |
        if [ -z "${{ github.event.inputs.release_tag }}" ]; then
          RELEASE_URL="https://api.github.com/repos/Doze-off/ProjectInfinity-X_gsi/releases/latest"
        else
          RELEASE_URL="https://api.github.com/repos/Doze-off/ProjectInfinity-X_gsi/releases/tags/${{ github.event.inputs.release_tag }}"
        fi
        
        RELEASE_DATA=$(curl -s "$RELEASE_URL")
        
        VANILLA_URL=$(echo "$RELEASE_DATA" | grep -o 'https://[^"]*VANILLA[^"]*\.xz' | head -1)
        GAPPS_URL=$(echo "$RELEASE_DATA" | grep -o 'https://[^"]*\.xz' | grep -v VANILLA | grep -v MICROG | head -1)
        
        if [ -z "$VANILLA_URL" ] || [ -z "$GAPPS_URL" ]; then
          echo "ERROR: Images not found!"
          exit 1
        fi
        
        echo "VANILLA_URL=$VANILLA_URL" >> $GITHUB_ENV
        echo "GAPPS_URL=$GAPPS_URL" >> $GITHUB_ENV
        
        VANILLA_NAME=$(basename "$VANILLA_URL")
        GAPPS_NAME=$(basename "$GAPPS_URL")
        echo "VANILLA_NAME=$VANILLA_NAME" >> $GITHUB_ENV
        echo "GAPPS_NAME=$GAPPS_NAME" >> $GITHUB_ENV
        
        RELEASE_TAG=$(echo "$RELEASE_DATA" | grep -o '"tag_name":"[^"]*"' | cut -d'"' -f4)
        echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
    
    - name: Download images in parallel
      run: |
        mkdir -p work_dir
        cd work_dir
        
        wget -q --show-progress "${{ env.VANILLA_URL }}" -O "${{ env.VANILLA_NAME }}" &
        PID_VANILLA=$!
        
        wget -q --show-progress "${{ env.GAPPS_URL }}" -O "${{ env.GAPPS_NAME }}" &
        PID_GAPPS=$!
        
        wait $PID_VANILLA
        VANILLA_EXIT=$?
        
        wait $PID_GAPPS
        GAPPS_EXIT=$?
        
        if [ $VANILLA_EXIT -ne 0 ] || [ $GAPPS_EXIT -ne 0 ]; then
          exit 1
        fi
    
    - name: Extract VANILLA
      run: |
        cd work_dir
        
        xz -d "${{ env.VANILLA_NAME }}"
        VANILLA_IMG="${VANILLA_NAME%.xz}"
        
        if file "$VANILLA_IMG" | grep -q "Android sparse image"; then
          simg2img "$VANILLA_IMG" vanilla_raw.img
          VANILLA_RAW="vanilla_raw.img"
        else
          VANILLA_RAW="$VANILLA_IMG"
        fi
        
        mkdir -p vanilla_extracted
        7z x "$VANILLA_RAW" -ovanilla_extracted -y > /dev/null 2>&1
    
    - name: Extract GAPPS
      run: |
        cd work_dir
        
        xz -d "${{ env.GAPPS_NAME }}"
        GAPPS_IMG="${GAPPS_NAME%.xz}"
        
        if file "$GAPPS_IMG" | grep -q "Android sparse image"; then
          simg2img "$GAPPS_IMG" gapps_raw.img
          GAPPS_RAW="gapps_raw.img"
        else
          GAPPS_RAW="$GAPPS_IMG"
        fi
        
        mkdir -p gapps_extracted
        7z x "$GAPPS_RAW" -ogapps_extracted -y > /dev/null 2>&1
    
    - name: Compare files
      run: |
        cd work_dir
        diff -qr vanilla_extracted/ gapps_extracted/ | tee ../diff_output.txt || true
    
    - name: Upload diff
      uses: actions/upload-artifact@v4
      with:
        name: gapps-vs-vanilla-diff
        path: diff_output.txt
