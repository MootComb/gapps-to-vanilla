name: release

on:
  workflow_dispatch:
    inputs:
      source_api_url:
        description: 'GitHub API URL for releases (leave empty for default)'
        required: false
        type: string
        default: ''
      count:
        description: 'Number of unique versions to process (default: 5)'
        required: false
        type: string
        default: '5'
      create_release:
        description: 'Create GitHub Release with all ZIPs?'
        required: false
        type: boolean
        default: true

env:
  DEFAULT_API_URL: "https://api.github.com/repos/Doze-off/ProjectInfinity-X_gsi/releases"
  WORK_DIR: ${{ github.workspace }}/gsi_work

permissions:
  contents: write

jobs:
  batch_generate:
    name: Generate ZIPs for unique versions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/*
          sparse-checkout-cone-mode: false

      - name: Set API URL
        id: set_api
        run: |
          if [[ -n "${{ github.event.inputs.source_api_url }}" ]]; then
            INPUT_URL="${{ github.event.inputs.source_api_url }}"
            # Convert github.com URL to api.github.com URL
            if echo "$INPUT_URL" | grep -q 'github.com'; then
              # Remove trailing slash, remove /releases if present
              CLEAN_URL=$(echo "$INPUT_URL" | sed 's|/$||' | sed 's|/releases$||')
              # Extract owner/repo from URL
              REPO_PATH=$(echo "$CLEAN_URL" | sed 's|https://github.com/||')
              # Build API URL
              API_URL="https://api.github.com/repos/${REPO_PATH}/releases"
            else
              API_URL="$INPUT_URL"
            fi
            echo "api_url=$API_URL" >> $GITHUB_OUTPUT
            echo "Using API URL: $API_URL"
          else
            echo "api_url=${{ env.DEFAULT_API_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils p7zip-full jq curl zip bc

      - name: Fetch all releases and select unique versions
        id: fetch_all
        run: |
          mkdir -p ${{ env.WORK_DIR }}
          
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Fetching releases..."
            curl -fsSL --retry 3 --retry-delay 5 "${{ steps.set_api.outputs.api_url }}" -o "${{ env.WORK_DIR }}/releases.json" && break
            sleep 10
          done
          
          if [[ ! -s "${{ env.WORK_DIR }}/releases.json" ]]; then
            echo "::error::Failed to fetch releases after 5 attempts"
            exit 1
          fi
          
          COUNT="${{ github.event.inputs.count }}"
          
          echo "Selecting $COUNT unique versions (newest first)..."
          
          RELEASES=$(jq -r --arg count "$COUNT" '
            [.[] | select(.assets | map(.name) | join(",") | test("VANILLA"; "i") and test("GAPPS"; "i"))] |
            map({
              tag: .tag_name,
              name: .name,
              date: .published_at,
              version: (.name | capture("(?<v>[0-9]+\\.[0-9]+)") | .v // "0.0")
            }) |
            map(select(.version != null and .version != "0.0")) |
            group_by(.version) |
            map(sort_by(.date) | reverse | .[0]) |
            sort_by(.version | split(".") | map(tonumber? // 0)) | reverse |
            .[:($count|tonumber)] |
            .[].tag
          ' "${{ env.WORK_DIR }}/releases.json")
          
          if [[ -z "$RELEASES" ]]; then
            echo "Version extraction failed, falling back to latest $COUNT releases"
            RELEASES=$(jq -r --arg count "$COUNT" '
              [.[] | select(.assets | map(.name) | join(",") | test("VANILLA"; "i") and test("GAPPS"; "i"))] |
              sort_by(.published_at) | reverse |
              .[:($count|tonumber)] |
              .[].tag_name
            ' "${{ env.WORK_DIR }}/releases.json")
          fi
          
          TOTAL=$(echo "$RELEASES" | wc -l)
          echo "Selected $TOTAL unique releases (newest first):"
          
          FIRST_TAG=$(echo "$RELEASES" | head -1)
          ROM_NAME=$(jq -r --arg tag "$FIRST_TAG" '.[] | select(.tag_name == $tag) | .name' "${{ env.WORK_DIR }}/releases.json" | grep -oP '^[^0-9]+' | sed 's/ *$//' | sed 's/ $//')
          ROM_NAME_CLEAN=$(echo "$ROM_NAME" | sed 's/ //g')
          echo "ROM: $ROM_NAME -> $ROM_NAME_CLEAN"
          echo "rom_name=$ROM_NAME" >> $GITHUB_OUTPUT
          echo "rom_name_clean=$ROM_NAME_CLEAN" >> $GITHUB_OUTPUT
          
          while IFS= read -r tag; do
            VERSION=$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .name' "${{ env.WORK_DIR }}/releases.json")
            echo "  $tag - $VERSION"
          done <<< "$RELEASES"
          
          echo "$RELEASES" > ${{ env.WORK_DIR }}/release_list.txt
          echo "total_releases=$TOTAL" >> $GITHUB_OUTPUT

      - name: Get existing release assets
        id: get_existing
        run: |
          ROM_NAME_CLEAN="${{ steps.fetch_all.outputs.rom_name_clean }}"
          RELEASE_TAG_NAME="gapps-to-vanilla-${ROM_NAME_CLEAN}"
          
          echo "release_tag_name=$RELEASE_TAG_NAME" >> $GITHUB_OUTPUT
          
          # Get existing assets from release
          echo "Checking existing release: $RELEASE_TAG_NAME"
          
          RELEASE_RESPONSE=$(curl -fsSL \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG_NAME" 2>/dev/null || echo "null")
          
          if [[ "$RELEASE_RESPONSE" != "null" ]]; then
            ASSET_NAMES=$(echo "$RELEASE_RESPONSE" | jq -r '.assets[].name' 2>/dev/null)
            if [[ -n "$ASSET_NAMES" ]]; then
              echo "Found existing assets:"
              echo "$ASSET_NAMES" | while read -r name; do
                echo "  - $name"
              done
              echo "$ASSET_NAMES" > ${{ env.WORK_DIR }}/existing_assets.txt
              
              # Also get full asset info with download URLs and sizes
              echo "$RELEASE_RESPONSE" | jq -r '.assets[] | "\(.name)|\(.browser_download_url)|\(.size)"' > ${{ env.WORK_DIR }}/existing_assets_info.txt
            else
              echo "Release exists but has no assets"
              touch ${{ env.WORK_DIR }}/existing_assets.txt
              touch ${{ env.WORK_DIR }}/existing_assets_info.txt
            fi
          else
            echo "No existing release found"
            touch ${{ env.WORK_DIR }}/existing_assets.txt
            touch ${{ env.WORK_DIR }}/existing_assets_info.txt
          fi

      - name: Process each release
        id: process_releases
        run: |
          ROM_NAME="${{ steps.fetch_all.outputs.rom_name }}"
          ROM_NAME_CLEAN="${{ steps.fetch_all.outputs.rom_name_clean }}"
          RELEASE_TAG_NAME="${{ steps.get_existing.outputs.release_tag_name }}"
          
          REPO_PATH="${{ github.repository }}"
          
          mkdir -p ${{ env.WORK_DIR }}/output
          rm -f ${{ env.WORK_DIR }}/output/*.zip
          
          PROCESSED=0
          SKIPPED=0
          ALL_ZIPS_LIST=""
          TEMP_LIST="${{ env.WORK_DIR }}/temp_list.txt"
          > "$TEMP_LIST"
          
          # First, add all existing assets to the temp list
          if [[ -s ${{ env.WORK_DIR }}/existing_assets_info.txt ]]; then
            echo ""
            echo "========================================="
            echo "Adding existing assets to Downloads list"
            echo "========================================="
            
            while IFS='|' read -r asset_name asset_url asset_size; do
              # Format size
              if [[ "$asset_size" -lt 1048576 ]]; then
                SIZE_HR="$((asset_size / 1024))K"
              else
                SIZE_HR="$(echo "scale=1; $asset_size / 1048576" | bc)M"
              fi
              
              # Extract version from asset name
              VERSION_FROM_ASSET=$(echo "$asset_name" | grep -oP '[0-9]+\.[0-9]+' | head -1)
              
              if [[ -n "$VERSION_FROM_ASSET" ]]; then
                echo "${VERSION_FROM_ASSET}|${asset_name}|${asset_url}|${SIZE_HR}|${ROM_NAME} ${VERSION_FROM_ASSET}" >> "$TEMP_LIST"
                echo "  Added existing: $asset_name ($SIZE_HR) -> version $VERSION_FROM_ASSET"
              fi
            done < ${{ env.WORK_DIR }}/existing_assets_info.txt
          fi
          
          while IFS= read -r release_tag; do
            echo ""
            echo "========================================="
            echo "[$((PROCESSED + 1))] Processing: $release_tag"
            echo "========================================="
            
            RELEASE_DATA=$(jq --arg tag "$release_tag" '.[] | select(.tag_name == $tag)' "${{ env.WORK_DIR }}/releases.json")
            
            RELEASE_NAME=$(echo "$RELEASE_DATA" | jq -r '.name')
            
            # Get full asset names
            VANILLA_ASSET=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("VANILLA"; "i")) | .name' | head -1)
            GAPPS_ASSET=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("GAPPS"; "i")) | .name' | head -1)
            VANILLA_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("VANILLA"; "i")) | .browser_download_url' | head -1)
            GAPPS_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("GAPPS"; "i")) | .browser_download_url' | head -1)
            
            if [[ -z "$VANILLA_URL" || -z "$GAPPS_URL" ]]; then
              echo "SKIP: $release_tag - missing VANILLA or GAPPS assets"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            
            VERSION_NUM=$(echo "$RELEASE_NAME" | grep -oP '[0-9]+\.[0-9]+' | head -1)
            RELEASE_DATE=$(echo "$RELEASE_DATA" | jq -r '.published_at' | cut -d'T' -f1)
            CLEAN_NAME=$(echo "$RELEASE_NAME" | sed 's/ | TREBLE GSI OFFICIAL-signed//')
            
            ZIP_NAME="gapps-to-vanilla_${ROM_NAME_CLEAN}-${VERSION_NUM}.zip"
            
            echo "Release: $CLEAN_NAME (v$VERSION_NUM, $RELEASE_DATE)"
            echo "  VANILLA file: $VANILLA_ASSET"
            echo "  GAPPS file:   $GAPPS_ASSET"
            echo "  Comparing: $VANILLA_ASSET vs $GAPPS_ASSET"
            echo ""
            
            echo "  Downloading..."
            mkdir -p ${{ env.WORK_DIR }}/downloads/$release_tag
            for i in 1 2 3; do
              curl -fL --retry 3 --retry-delay 5 -o "${{ env.WORK_DIR }}/downloads/$release_tag/vanilla.img.xz" "$VANILLA_URL" 2>/dev/null && break
              sleep 5
            done
            for i in 1 2 3; do
              curl -fL --retry 3 --retry-delay 5 -o "${{ env.WORK_DIR }}/downloads/$release_tag/gapps.img.xz" "$GAPPS_URL" 2>/dev/null && break
              sleep 5
            done
            
            echo "  Extracting..."
            mkdir -p ${{ env.WORK_DIR }}/extracted/$release_tag/vanilla
            mkdir -p ${{ env.WORK_DIR }}/extracted/$release_tag/gapps
            
            xz -d "${{ env.WORK_DIR }}/downloads/$release_tag/vanilla.img.xz" 2>/dev/null
            set +e
            7z x "${{ env.WORK_DIR }}/downloads/$release_tag/vanilla.img" -o"${{ env.WORK_DIR }}/extracted/$release_tag/vanilla" > /dev/null 2>&1
            set -e
            
            xz -d "${{ env.WORK_DIR }}/downloads/$release_tag/gapps.img.xz" 2>/dev/null
            set +e
            7z x "${{ env.WORK_DIR }}/downloads/$release_tag/gapps.img" -o"${{ env.WORK_DIR }}/extracted/$release_tag/gapps" > /dev/null 2>&1
            set -e
            
            echo "  Comparing filesystems..."
            cd ${{ env.WORK_DIR }}/extracted/$release_tag
            
            echo "  Running: diff -qr vanilla gapps"
            echo "  (Comparing all files between VANILLA and GAPPS images)"
            echo ""
            
            diff -qr vanilla gapps 2>&1 | grep -v 'No such file or directory' > full_diff_raw.txt || true
            
            # Show first 10 lines of diff for preview
            DIFF_LINES=$(wc -l < full_diff_raw.txt)
            echo "  Total diff lines: $DIFF_LINES"
            if [[ "$DIFF_LINES" -gt 0 ]]; then
              echo "  Diff preview (first 10 lines):"
              head -10 full_diff_raw.txt | while read -r line; do
                echo "    $line"
              done
              if [[ "$DIFF_LINES" -gt 10 ]]; then
                echo "    ... and $((DIFF_LINES - 10)) more lines"
              fi
            else
              echo "  No differences found!"
            fi
            echo ""
            
            cat full_diff_raw.txt | \
              sed 's|system/product/|product/|g' | \
              sed 's|system/system_ext/|system_ext/|g' | \
              grep -E '(^Only in.*(system/|system_ext/|product/)|^Files.*(system/|system_ext/|product/))' | \
              grep -v 'build\.prop' | sort -u > filtered_diff.txt || true
            
            grep '^Only in gapps' filtered_diff.txt | sed 's|^Only in gapps/||' | sed 's|: |/|' | sort -u > gapps_only.txt
            grep '^Only in vanilla' filtered_diff.txt | sed 's|^Only in vanilla/||' | sed 's|: |/|' | sort -u > vanilla_only.txt
            grep '^Files.*differ' filtered_diff.txt | sed 's|^Files vanilla/||' | sed 's| and .* differ||' | sort -u > differ.txt
            
            GAPPS_COUNT=$(wc -l < gapps_only.txt)
            VANILLA_COUNT=$(wc -l < vanilla_only.txt)
            DIFFER_COUNT=$(wc -l < differ.txt)
            
            echo "  Files only in GAPPS (will be deleted): $GAPPS_COUNT"
            if [[ "$GAPPS_COUNT" -gt 0 && "$GAPPS_COUNT" -le 20 ]]; then
              cat gapps_only.txt | while read -r file; do
                echo "    - $file"
              done
            elif [[ "$GAPPS_COUNT" -gt 20 ]]; then
              echo "    (showing first 10 of $GAPPS_COUNT)"
              head -10 gapps_only.txt | while read -r file; do
                echo "    - $file"
              done
              echo "    ... and $((GAPPS_COUNT - 10)) more"
            fi
            
            echo "  Files only in VANILLA (will be restored): $VANILLA_COUNT"
            if [[ "$VANILLA_COUNT" -gt 0 && "$VANILLA_COUNT" -le 20 ]]; then
              cat vanilla_only.txt | while read -r file; do
                echo "    - $file"
              done
            elif [[ "$VANILLA_COUNT" -gt 20 ]]; then
              echo "    (showing first 10 of $VANILLA_COUNT)"
              head -10 vanilla_only.txt | while read -r file; do
                echo "    - $file"
              done
              echo "    ... and $((VANILLA_COUNT - 10)) more"
            fi
            
            echo "  Files that differ (will be replaced): $DIFFER_COUNT"
            if [[ "$DIFFER_COUNT" -gt 0 && "$DIFFER_COUNT" -le 20 ]]; then
              cat differ.txt | while read -r file; do
                echo "    - $file"
              done
            elif [[ "$DIFFER_COUNT" -gt 20 ]]; then
              echo "    (showing first 10 of $DIFFER_COUNT)"
              head -10 differ.txt | while read -r file; do
                echo "    - $file"
              done
              echo "    ... and $((DIFFER_COUNT - 10)) more"
            fi
            
            echo ""
            echo "  Summary: Delete $GAPPS_COUNT, Restore $VANILLA_COUNT, Replace $DIFFER_COUNT"
            
            ZIP_DIR="${{ env.WORK_DIR }}/zip_$release_tag"
            rm -rf "$ZIP_DIR"
            mkdir -p "$ZIP_DIR"
            
            while IFS= read -r item; do
              if [[ -n "$item" ]]; then
                if [[ -f "vanilla/$item" ]]; then
                  mkdir -p "$ZIP_DIR/$(dirname "$item")"
                  cp "vanilla/$item" "$ZIP_DIR/$item"
                elif [[ -d "vanilla/$item" ]]; then
                  mkdir -p "$ZIP_DIR/$item"
                  cp -r "vanilla/$item/"* "$ZIP_DIR/$item/" 2>/dev/null || true
                fi
              fi
            done < vanilla_only.txt
            
            while IFS= read -r file; do
              if [[ -n "$file" && -f "vanilla/$file" ]]; then
                mkdir -p "$ZIP_DIR/$(dirname "$file")"
                cp "vanilla/$file" "$ZIP_DIR/$file"
              fi
            done < differ.txt
            
            while IFS= read -r item; do
              if [[ -n "$item" ]]; then
                echo "/$item" >> "$ZIP_DIR/delete.list"
              fi
            done < gapps_only.txt
            
            mkdir -p "$ZIP_DIR/META-INF/com/google/android"
            cp "${{ github.workspace }}/scripts/update-binary" "$ZIP_DIR/META-INF/com/google/android/update-binary"
            cp "${{ github.workspace }}/scripts/updater-script" "$ZIP_DIR/META-INF/com/google/android/updater-script"
            chmod +x "$ZIP_DIR/META-INF/com/google/android/update-binary"
            
            cd "$ZIP_DIR"
            zip -r "${{ env.WORK_DIR }}/output/${ZIP_NAME}" . -x "*.git*" > /dev/null 2>&1
            
            ZIP_SIZE=$(du -h "${{ env.WORK_DIR }}/output/${ZIP_NAME}" | cut -f1)
            echo "  Done: ${ZIP_NAME} (${ZIP_SIZE})"
            
            # Add new zip to temp list
            echo "${VERSION_NUM}|${ZIP_NAME}|https://github.com/${REPO_PATH}/releases/download/${RELEASE_TAG_NAME}/${ZIP_NAME}|${ZIP_SIZE}|${ROM_NAME} ${VERSION_NUM}" >> "$TEMP_LIST"
            
            PROCESSED=$((PROCESSED + 1))
            
            rm -rf "${{ env.WORK_DIR }}/downloads/$release_tag"
            rm -rf "${{ env.WORK_DIR }}/extracted/$release_tag"
            rm -rf "$ZIP_DIR"
            
          done < ${{ env.WORK_DIR }}/release_list.txt
          
          # Sort by version (newest first) and remove duplicates (keep first occurrence)
          echo ""
          echo "========================================="
          echo "Sorting downloads by version (newest first)..."
          echo "========================================="
          
          # Sort by version descending (newest first) and remove duplicates based on version
          sort -t'|' -k1 -V -r "$TEMP_LIST" | \
            awk -F'|' '!seen[$1]++' | \
            while IFS='|' read -r version asset_name asset_url size display_name; do
              # Clean display name - remove everything after |
              DISPLAY_CLEAN=$(echo "$display_name" | sed 's/|.*//' | sed 's/ *$//')
              ALL_ZIPS_LIST="${ALL_ZIPS_LIST}- [${asset_name}](${asset_url}) (${size}) — ${DISPLAY_CLEAN}
          "
            done
          
          echo ""
          echo "========================================="
          echo "Batch complete!"
          echo "  Processed: $PROCESSED"
          echo "  Skipped: $SKIPPED"
          
          GENERATED_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          echo "processed=$PROCESSED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "generated_date=$GENERATED_DATE" >> $GITHUB_OUTPUT
          
          echo "all_zips_list<<ALLZIPSEOF" >> $GITHUB_OUTPUT
          echo "$ALL_ZIPS_LIST" >> $GITHUB_OUTPUT
          echo "ALLZIPSEOF" >> $GITHUB_OUTPUT

      - name: Upload all ZIPs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-gapps-to-vanilla-zips
          path: ${{ env.WORK_DIR }}/output/*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' && steps.process_releases.outputs.processed > 0 }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_existing.outputs.release_tag_name }}
          name: "${{ steps.fetch_all.outputs.rom_name_clean }}"
          body: |
            ## gapps-to-vanilla
            
            **Source:** ${{ steps.set_api.outputs.api_url }}
            **Generated:** ${{ steps.process_releases.outputs.generated_date }}
            **Versions:** ${{ steps.process_releases.outputs.processed }}
            
            ### Downloads
            
            ${{ steps.process_releases.outputs.all_zips_list }}
            
            ### Instructions
            
            1. Download the ZIP for your version
            2. Flash via TWRP/OrangeFox recovery
            3. Reboot system
          files: ${{ env.WORK_DIR }}/output/*
          draft: false
          prerelease: false

      - name: Display summary
        run: |
          echo "## gapps-to-vanilla" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** ${{ steps.set_api.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** ${{ steps.process_releases.outputs.generated_date }}" >> $GITHUB_STEP_SUMMARY
          echo "**Versions:** ${{ steps.process_releases.outputs.processed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Downloads" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.process_releases.outputs.all_zips_list }}" >> $GITHUB_STEP_SUMMARY
