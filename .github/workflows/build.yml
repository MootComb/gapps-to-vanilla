name: gapps-to-vanilla

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Specific release tag (leave empty for latest VANILLA)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xz-utils wget unzip e2fsprogs p7zip-full
        
        git clone https://github.com/anestisb/android-simg2img.git
        cd android-simg2img
        make
        sudo cp simg2img img2simg /usr/local/bin/
        cd ..
    
    - name: Get latest VANILLA release
      id: latest_release
      run: |
        if [ -z "${{ github.event.inputs.release_tag }}" ]; then
          RELEASES_URL="https://api.github.com/repos/Doze-off/ProjectInfinity-X_gsi/releases"
          ALL_RELEASES=$(curl -s $RELEASES_URL)
          
          DOWNLOAD_URL=$(echo "$ALL_RELEASES" | grep -o 'https://github.com/Doze-off/ProjectInfinity-X_gsi/releases/download/[^"]*VANILLA[^"]*\.xz' | head -1)
          RELEASE_TAG=$(echo "$DOWNLOAD_URL" | grep -o 'download/[^/]*/' | cut -d'/' -f2)
        else
          DOWNLOAD_URL="https://github.com/Doze-off/ProjectInfinity-X_gsi/releases/download/${{ github.event.inputs.release_tag }}/Infinity-X-*_GSI_treble_arm64-ab-VANILLA-Official-*.img.xz"
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
        fi
        
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "No VANILLA release found!"
          exit 1
        fi
        
        echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
        echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
        FILENAME=$(basename "$DOWNLOAD_URL")
        echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
        
        echo "Found VANILLA release: ${RELEASE_TAG}"
        echo "Download URL: ${DOWNLOAD_URL}"
    
    - name: Download Vanilla GSI
      run: |
        mkdir -p vanilla_image
        cd vanilla_image
        wget "${{ steps.latest_release.outputs.download_url }}" -O "${{ steps.latest_release.outputs.filename }}"
        echo "XZ_FILE=${{ steps.latest_release.outputs.filename }}" >> $GITHUB_ENV
    
    - name: Extract XZ to IMG
      run: |
        cd vanilla_image
        xz -d -v "${{ env.XZ_FILE }}"
        IMG_FILE="${XZ_FILE%.xz}"
        echo "IMG_FILE=${IMG_FILE}" >> $GITHUB_ENV
    
    - name: Convert sparse to raw if needed
      run: |
        cd vanilla_image
        if file "${{ env.IMG_FILE }}" | grep -q "Android sparse image"; then
          simg2img "${{ env.IMG_FILE }}" raw.img
          export RAW_IMG="raw.img"
        else
          export RAW_IMG="${{ env.IMG_FILE }}"
        fi
        echo "RAW_IMG=${RAW_IMG}" >> $GITHUB_ENV
    
    - name: Extract image with 7zip
      run: |
        mkdir vanilla_extracted
        cd vanilla_image
        7z x "${{ env.RAW_IMG }}" -o../vanilla_extracted -y || true
        
        echo "7zip extraction completed (symlink warnings are safe to ignore)"
    
    - name: Extract with fallback mount method if needed
      if: ${{ failure() || steps.extract_7zip.outcome == 'failure' }}
      run: |
        if [ ! -d "vanilla_extracted/system" ] && [ ! -d "vanilla_extracted/system_ext" ]; then
          echo "7zip extraction produced no output, trying mount method..."
          
          sudo mkdir -p /mnt/vanilla
          sudo mount -o loop,ro vanilla_image/${{ env.RAW_IMG }} /mnt/vanilla
          
          mkdir -p vanilla_extracted
          sudo cp -a /mnt/vanilla/* vanilla_extracted/
          
          sudo umount /mnt/vanilla
          sudo chown -R $(id -u):$(id -g) vanilla_extracted/
        fi
    
    - name: Process extracted structure
      run: |
        cd vanilla_extracted
        
        if [ -d "system" ] && [ -d "system/system" ]; then
          mv system/system/* .
          rm -rf system
        fi
        
        cd ..
        
        mkdir -p vanilla
        
        cp -r vanilla_extracted/system_ext/priv-app vanilla/ 2>/dev/null || true
        cp -r vanilla_extracted/product/app vanilla/product/ 2>/dev/null || true
        cp -r vanilla_extracted/product/priv-app vanilla/product/ 2>/dev/null || true
        cp -r vanilla_extracted/system/system/app vanilla/system/ 2>/dev/null || true
        cp -r vanilla_extracted/system/system/priv-app vanilla/system/ 2>/dev/null || true
        cp -r vanilla_extracted/system_ext/etc vanilla/system_ext/ 2>/dev/null || true
        cp -r vanilla_extracted/product/etc vanilla/product/ 2>/dev/null || true
        cp -r vanilla_extracted/product/lib64 vanilla/product/ 2>/dev/null || true
        
        mkdir -p vanilla/product/etc/default-permissions
        mkdir -p vanilla/product/etc/permissions
        mkdir -p vanilla/product/etc/sysconfig
        mkdir -p vanilla/system_ext/etc/aconfig
        
        cp vanilla_extracted/product/etc/default-permissions/*.xml vanilla/product/etc/default-permissions/ 2>/dev/null || true
        cp vanilla_extracted/product/etc/permissions/*.xml vanilla/product/etc/permissions/ 2>/dev/null || true
        cp vanilla_extracted/product/etc/sysconfig/*.xml vanilla/product/etc/sysconfig/ 2>/dev/null || true
        cp vanilla_extracted/product/lib64/*.so vanilla/product/lib64/ 2>/dev/null || true
        
        cp vanilla_extracted/system_ext/etc/permissions/*.xml vanilla/system_ext/etc/permissions/ 2>/dev/null || true
        
        cp vanilla_extracted/product/etc/NOTICE.xml.gz vanilla/product/etc/ 2>/dev/null || true
        cp vanilla_extracted/system/etc/NOTICE.xml.gz vanilla/system/etc/ 2>/dev/null || true
        cp vanilla_extracted/system_ext/etc/NOTICE.xml.gz vanilla/system_ext/etc/ 2>/dev/null || true
        
        for file in flag.info flag.map flag.val package.map; do
          cp vanilla_extracted/system_ext/etc/aconfig/$file vanilla/system_ext/etc/aconfig/ 2>/dev/null || true
        done
        cp vanilla_extracted/system_ext/etc/aconfig_flags.pb vanilla/system_ext/etc/ 2>/dev/null || true
        
        echo "Extracted components:"
        find vanilla -type f 2>/dev/null | head -20 || echo "No files found"
        
        if [ ! -d "vanilla/priv-app" ] || [ -z "$(ls -A vanilla/priv-app 2>/dev/null)" ]; then
          echo "Warning: No priv-app extracted, but continuing"
        fi
        
        echo "Vanilla components processed"
    
    - name: Run gapps-to-vanilla script
      run: |
        if [ -f "scripts/gapps-to-vanilla.sh" ]; then
          chmod +x scripts/gapps-to-vanilla.sh
          ./scripts/gapps-to-vanilla.sh
        else
          echo "scripts/gapps-to-vanilla.sh not found, creating dummy zip"
          mkdir -p temp
          echo "# gapps-to-vanilla" > temp/README.md
          cd temp
          zip -r ../gapps-to-vanilla.zip .
          cd ..
        fi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gapps-to-vanilla-${{ steps.latest_release.outputs.release_tag }}
        path: gapps-to-vanilla.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.latest_release.outputs.release_tag }}
        name: gapps-to-vanilla - ${{ steps.latest_release.outputs.release_tag }}
        body: |
          ## gapps-to-vanilla
          
          Convert GAPPS to Vanilla AOSP
          
          Built from VANILLA image: ${{ steps.latest_release.outputs.download_url }}
          
          ### What it does:
          - Removes all Google apps and services (GAPPS)
          - Restores original AOSP components
          
          ### Installation:
          1. Download `gapps-to-vanilla.zip`
          2. Boot to recovery (TWRP/OrangeFox)
          3. Install the ZIP file
          4. Reboot system
          
          Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        files: |
          gapps-to-vanilla.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
