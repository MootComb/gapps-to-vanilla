name: GSI Release Monitor

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 3.9, leave empty for latest)'
        required: false
        type: string
        default: ''
      source_api_url:
        description: 'GitHub API URL for releases (leave empty for default)'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 */6 * * *'

env:
  DEFAULT_API_URL: "https://api.github.com/repos/Doze-off/ProjectInfinity-X_gsi/releases"
  WORK_DIR: ${{ github.workspace }}/gsi_work

permissions:
  contents: read

jobs:
  check_and_compare:
    name: Check release and compare images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/*
          sparse-checkout-cone-mode: false

      - name: Set API URL
        id: set_api
        run: |
          if [[ -n "${{ github.event.inputs.source_api_url }}" ]]; then
            echo "api_url=${{ github.event.inputs.source_api_url }}" >> $GITHUB_OUTPUT
          else
            echo "api_url=${{ env.DEFAULT_API_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils p7zip-full jq curl zip

      - name: Fetch releases
        id: fetch
        run: |
          mkdir -p ${{ env.WORK_DIR }}
          curl -fsSL "${{ steps.set_api.outputs.api_url }}" -o "${{ env.WORK_DIR }}/releases.json"
          
          TARGET_VERSION="${{ github.event.inputs.release_version }}"
          
          if [[ -z "$TARGET_VERSION" ]]; then
            LATEST_RELEASE=$(jq -r '.[0]' "${{ env.WORK_DIR }}/releases.json")
            echo "Using latest release"
          else
            echo "Searching for version: $TARGET_VERSION"
            LATEST_RELEASE=$(jq --arg ver "$TARGET_VERSION" '
              map(select(.name | test($ver; "i"))) | 
              sort_by(.published_at) | 
              reverse | 
              .[0]
            ' "${{ env.WORK_DIR }}/releases.json")
            
            if [[ "$LATEST_RELEASE" == "null" || -z "$LATEST_RELEASE" ]]; then
              echo "::error::Version $TARGET_VERSION not found"
              echo ""
              echo "Available releases:"
              jq -r '.[] | "\(.tag_name) - \(.name)"' "${{ env.WORK_DIR }}/releases.json"
              exit 1
            fi
            
            MATCH_COUNT=$(jq --arg ver "$TARGET_VERSION" '[.[] | select(.name | test($ver; "i"))] | length' "${{ env.WORK_DIR }}/releases.json")
            echo "Found $MATCH_COUNT release(s), using latest"
          fi
          
          RELEASE_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          RELEASE_NAME=$(echo "$LATEST_RELEASE" | jq -r '.name')
          RELEASE_DATE=$(echo "$LATEST_RELEASE" | jq -r '.published_at')
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          
          VANILLA_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("VANILLA"; "i")) | .browser_download_url' | head -1)
          GAPPS_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("GAPPS"; "i")) | .browser_download_url' | head -1)
          
          if [[ -z "$VANILLA_URL" || -z "$GAPPS_URL" ]]; then
            echo "::error::Required assets not found"
            exit 1
          fi
          
          echo "vanilla_url=$VANILLA_URL" >> $GITHUB_OUTPUT
          echo "gapps_url=$GAPPS_URL" >> $GITHUB_OUTPUT
          
          echo "Selected: $RELEASE_NAME ($RELEASE_TAG)"
          echo "Published: $RELEASE_DATE"
          
      - name: Download VANILLA
        run: |
          mkdir -p ${{ env.WORK_DIR }}/downloads
          echo "Downloading VANILLA..."
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/vanilla.img.xz" \
            "${{ steps.fetch.outputs.vanilla_url }}"
          echo "Done"
          
      - name: Download GAPPS
        run: |
          echo "Downloading GAPPS..."
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/gapps.img.xz" \
            "${{ steps.fetch.outputs.gapps_url }}"
          echo "Done"
          
      - name: Extract VANILLA
        run: |
          VANILLA_OUT="${{ env.WORK_DIR }}/extracted/vanilla"
          mkdir -p "$VANILLA_OUT"
          
          echo "Extracting VANILLA..."
          xz -d "${{ env.WORK_DIR }}/downloads/vanilla.img.xz"
          set +e
          7z x "${{ env.WORK_DIR }}/downloads/vanilla.img" -o"$VANILLA_OUT"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi
          echo "VANILLA_EXTRACTED=$VANILLA_OUT" >> $GITHUB_ENV
          echo "Done"

      - name: Extract GAPPS
        run: |
          GAPPS_OUT="${{ env.WORK_DIR }}/extracted/gapps"
          mkdir -p "$GAPPS_OUT"
          
          echo "Extracting GAPPS..."
          xz -d "${{ env.WORK_DIR }}/downloads/gapps.img.xz"
          set +e
          7z x "${{ env.WORK_DIR }}/downloads/gapps.img" -o"$GAPPS_OUT"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi
          echo "GAPPS_EXTRACTED=$GAPPS_OUT" >> $GITHUB_ENV
          echo "Done"

      - name: Generate file lists and diff
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          echo "Generating diff..."
          diff -qr vanilla gapps 2>&1 | \
            grep -v 'No such file or directory' > ${{ env.WORK_DIR }}/full_diff_raw.txt || true
          
          # Normalize paths and filter
          cat ${{ env.WORK_DIR }}/full_diff_raw.txt | \
            sed 's|system/product/|product/|g' | \
            sed 's|system/system_ext/|system_ext/|g' | \
            grep -E '(^Only in.*(system/|system_ext/|product/)|^Files.*(system/|system_ext/|product/))' | \
            grep -v 'build\.prop' | \
            sort -u > ${{ env.WORK_DIR }}/filtered_diff.txt || true
          
          cat ${{ env.WORK_DIR }}/full_diff_raw.txt | \
            grep -v '^diff:' | sort -u > ${{ env.WORK_DIR }}/full_diff.txt || true
          
          echo "Full diff: $(wc -l < ${{ env.WORK_DIR }}/full_diff.txt) lines"
          echo "Filtered diff: $(wc -l < ${{ env.WORK_DIR }}/filtered_diff.txt) lines"

      - name: Generate comparison report
        run: |
          CURRENT_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          cat > ${{ env.WORK_DIR }}/comparison_report.md << EOF
          # GSI Image Comparison: VANILLA vs GAPPS
          
          **Release:** ${{ steps.fetch.outputs.release_name }}
          
          **Tag:** ${{ steps.fetch.outputs.release_tag }}
          
          **Published:** ${{ steps.fetch.outputs.release_date }}
          
          **Comparison date:** ${CURRENT_DATE}
          
          ---
          
          ## Filtered structural differences
          
          Filter: Only \`system/\`, \`system_ext/\`, \`product/\` - excluding \`build.prop\`
          
          \`\`\`diff
          $(cat ${{ env.WORK_DIR }}/filtered_diff.txt)
          \`\`\`
          EOF

      - name: Generate gapps-to-vanilla recovery ZIP
        id: generate_zip
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          ZIP_DIR="${{ env.WORK_DIR }}/gapps_to_vanilla_zip"
          rm -rf "$ZIP_DIR"
          mkdir -p "$ZIP_DIR"
          
          echo "=== PARSING FILTERED DIFF ==="
          
          grep '^Only in gapps' ${{ env.WORK_DIR }}/filtered_diff.txt | \
            sed 's|^Only in gapps/||' | sed 's|: |/|' | sort -u > ${{ env.WORK_DIR }}/gapps_only.txt
          
          grep '^Only in vanilla' ${{ env.WORK_DIR }}/filtered_diff.txt | \
            sed 's|^Only in vanilla/||' | sed 's|: |/|' | sort -u > ${{ env.WORK_DIR }}/vanilla_only.txt
          
          grep '^Files.*differ' ${{ env.WORK_DIR }}/filtered_diff.txt | \
            sed 's|^Files vanilla/||' | sed 's| and .* differ||' | sort -u > ${{ env.WORK_DIR }}/differ.txt
          
          GAPPS_ONLY_COUNT=$(wc -l < ${{ env.WORK_DIR }}/gapps_only.txt)
          VANILLA_ONLY_COUNT=$(wc -l < ${{ env.WORK_DIR }}/vanilla_only.txt)
          DIFFER_COUNT=$(wc -l < ${{ env.WORK_DIR }}/differ.txt)
          
          echo "To DELETE: $GAPPS_ONLY_COUNT items"
          echo "To RESTORE: $VANILLA_ONLY_COUNT items"
          echo "To REPLACE: $DIFFER_COUNT items"
          
          # RESTORE vanilla-only items
          echo ""
          echo "=== RESTORING VANILLA-ONLY ITEMS ==="
          VANILLA_COUNT=0
          while IFS= read -r item; do
            if [[ -n "$item" ]]; then
              if [[ -f "vanilla/$item" ]]; then
                TARGET_DIR="$ZIP_DIR/$(dirname "$item")"
                mkdir -p "$TARGET_DIR"
                cp "vanilla/$item" "$ZIP_DIR/$item"
                VANILLA_COUNT=$((VANILLA_COUNT + 1))
                echo "  + [FILE] $item"
              elif [[ -d "vanilla/$item" ]]; then
                TARGET_DIR="$ZIP_DIR/$item"
                mkdir -p "$TARGET_DIR"
                cp -r "vanilla/$item/"* "$TARGET_DIR/" 2>/dev/null || true
                FILE_COUNT=$(find "$TARGET_DIR" -type f | wc -l)
                VANILLA_COUNT=$((VANILLA_COUNT + FILE_COUNT))
                echo "  + [DIR]  $item/ ($FILE_COUNT files)"
              else
                echo "  ! NOT FOUND: $item"
              fi
            fi
          done < ${{ env.WORK_DIR }}/vanilla_only.txt
          
          # REPLACE different files
          echo ""
          echo "=== REPLACING DIFFERENT FILES ==="
          DIFF_COUNT=0
          while IFS= read -r file; do
            if [[ -n "$file" && -f "vanilla/$file" ]]; then
              TARGET_DIR="$ZIP_DIR/$(dirname "$file")"
              mkdir -p "$TARGET_DIR"
              cp "vanilla/$file" "$ZIP_DIR/$file"
              DIFF_COUNT=$((DIFF_COUNT + 1))
              echo "  * $file"
            else
              echo "  ! NOT FOUND: $file"
            fi
          done < ${{ env.WORK_DIR }}/differ.txt
          
          # CREATE delete list
          echo ""
          echo "=== CREATING DELETE LIST ==="
          while IFS= read -r item; do
            if [[ -n "$item" ]]; then
              echo "/$item" >> "$ZIP_DIR/delete.list"
            fi
          done < ${{ env.WORK_DIR }}/gapps_only.txt
          DELETE_COUNT=$(wc -l < "$ZIP_DIR/delete.list" 2>/dev/null || echo 0)
          echo "Delete list: $DELETE_COUNT entries"
          
          # META-INF
          mkdir -p "$ZIP_DIR/META-INF/com/google/android"
          cp "${{ github.workspace }}/scripts/update-binary" "$ZIP_DIR/META-INF/com/google/android/update-binary"
          cp "${{ github.workspace }}/scripts/updater-script" "$ZIP_DIR/META-INF/com/google/android/updater-script"
          chmod +x "$ZIP_DIR/META-INF/com/google/android/update-binary"
          
          RELEASE_TAG="${{ steps.fetch.outputs.release_tag }}"
          RECOVERY_ZIP="gapps-to-vanilla-${RELEASE_TAG}.zip"
          ARTIFACT_ZIP="gapps-to-vanilla-${RELEASE_TAG}-flashable.zip"
          
          # Create recovery ZIP
          cd "$ZIP_DIR"
          zip -r "${{ env.WORK_DIR }}/${RECOVERY_ZIP}" . -x "*.git*"
          
          # Create upload package with README
          mkdir -p ${{ env.WORK_DIR }}/upload
          cp "${{ env.WORK_DIR }}/${RECOVERY_ZIP}" "${{ env.WORK_DIR }}/upload/${RECOVERY_ZIP}"
          
          cat > "${{ env.WORK_DIR }}/upload/README.txt" << READMEEOF
=========================================
gapps-to-vanilla Recovery ZIP
=========================================

Release: ${{ steps.fetch.outputs.release_name }}
Tag: ${RELEASE_TAG}
Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

This package contains:
  - ${RECOVERY_ZIP} - Flash this via recovery
  - README.txt - This file

Instructions:
  1. Extract this ZIP file
  2. Copy ${RECOVERY_ZIP} to your device
  3. Boot into TWRP/OrangeFox recovery
  4. Flash ${RECOVERY_ZIP}
  5. Reboot system

What it does:
  - Removes GAPPS files (${DELETE_COUNT} items)
  - Restores VANILLA AOSP files ($((VANILLA_COUNT + DIFF_COUNT)) files)
READMEEOF
          
          cd "${{ env.WORK_DIR }}/upload"
          zip -r "${{ env.WORK_DIR }}/${ARTIFACT_ZIP}" . -x "*.git*"
          
          ZIP_SIZE=$(du -h "${{ env.WORK_DIR }}/${RECOVERY_ZIP}" | cut -f1)
          
          echo "recovery_zip=$RECOVERY_ZIP" >> $GITHUB_OUTPUT
          echo "artifact_zip=$ARTIFACT_ZIP" >> $GITHUB_OUTPUT
          echo "zip_size=$ZIP_SIZE" >> $GITHUB_OUTPUT
          echo "zip_path=${{ env.WORK_DIR }}/${ARTIFACT_ZIP}" >> $GITHUB_OUTPUT
          
          echo ""
          echo "========================================="
          echo "Recovery ZIP: ${RECOVERY_ZIP} (${ZIP_SIZE})"
          echo "Artifact: ${ARTIFACT_ZIP}"
          echo "Restore: $((VANILLA_COUNT + DIFF_COUNT)) files"
          echo "Delete: ${DELETE_COUNT} items"
          echo "========================================="

      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report-${{ steps.fetch.outputs.release_tag }}
          path: |
            ${{ env.WORK_DIR }}/comparison_report.md
            ${{ env.WORK_DIR }}/filtered_diff.txt
            ${{ env.WORK_DIR }}/full_diff.txt
          retention-days: 30

      - name: Upload recovery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gapps-to-vanilla-${{ steps.fetch.outputs.release_tag }}
          path: ${{ steps.generate_zip.outputs.zip_path }}
          retention-days: 30

      - name: Display summary
        run: |
          {
            echo "## GSI Comparison Complete"
            echo ""
            echo "### Release Info"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Release | ${{ steps.fetch.outputs.release_name }} |"
            echo "| Tag | ${{ steps.fetch.outputs.release_tag }} |"
            echo "| Published | ${{ steps.fetch.outputs.release_date }} |"
            echo ""
            echo "### Downloads"
            echo "| Artifact | Description |"
            echo "|----------|-------------|"
            echo "| comparison-report-${{ steps.fetch.outputs.release_tag }} | Comparison report |"
            echo "| gapps-to-vanilla-${{ steps.fetch.outputs.release_tag }} | Recovery flashable package |"
            echo ""
            echo "### How to use"
            echo "1. Download **gapps-to-vanilla-${{ steps.fetch.outputs.release_tag }}.zip**"
            echo "2. Extract it -> get **${{ steps.generate_zip.outputs.recovery_zip }}** + README.txt"
            echo "3. Copy **${{ steps.generate_zip.outputs.recovery_zip }}** to device"
            echo "4. Flash via TWRP/OrangeFox"
            echo "5. Reboot"
          } >> $GITHUB_STEP_SUMMARY
