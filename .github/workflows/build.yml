name: GSI Release Monitor

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 3.9, leave empty for latest)'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 */6 * * *'

env:
  SOURCE_API_URL: "https://api.github.com/repos/Doze-off/ProjectInfinity-X_gsi/releases"
  WORK_DIR: ${{ github.workspace }}/gsi_work

permissions:
  contents: read

jobs:
  check_and_compare:
    name: Check release and compare images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/*
          sparse-checkout-cone-mode: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils p7zip-full jq curl zip

      - name: Fetch releases
        id: fetch
        run: |
          mkdir -p ${{ env.WORK_DIR }}
          curl -fsSL "${{ env.SOURCE_API_URL }}" -o "${{ env.WORK_DIR }}/releases.json"
          
          TARGET_VERSION="${{ github.event.inputs.release_version }}"
          
          if [[ -z "$TARGET_VERSION" ]]; then
            LATEST_RELEASE=$(jq -r '.[0]' "${{ env.WORK_DIR }}/releases.json")
            echo "Using latest release"
          else
            echo "Searching for version: $TARGET_VERSION"
            LATEST_RELEASE=$(jq --arg ver "$TARGET_VERSION" 'map(select(.tag_name | contains($ver))) | .[0]' "${{ env.WORK_DIR }}/releases.json")
            
            if [[ "$LATEST_RELEASE" == "null" || -z "$LATEST_RELEASE" ]]; then
              echo "::error::Version $TARGET_VERSION not found. Available versions:"
              jq -r '.[].tag_name' "${{ env.WORK_DIR }}/releases.json"
              exit 1
            fi
          fi
          
          if [[ "$LATEST_RELEASE" == "null" ]]; then
            echo "::error::No releases found"
            exit 1
          fi
          
          RELEASE_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          
          VANILLA_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("VANILLA"; "i")) | .browser_download_url' | head -1)
          GAPPS_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("GAPPS"; "i")) | .browser_download_url' | head -1)
          
          if [[ -z "$VANILLA_URL" || -z "$GAPPS_URL" ]]; then
            echo "::error::Required assets not found"
            exit 1
          fi
          
          echo "vanilla_url=$VANILLA_URL" >> $GITHUB_OUTPUT
          echo "gapps_url=$GAPPS_URL" >> $GITHUB_OUTPUT
          
          echo "Found release: $RELEASE_TAG"
          
      - name: Download VANILLA
        run: |
          mkdir -p ${{ env.WORK_DIR }}/downloads
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/vanilla.img.xz" \
            "${{ steps.fetch.outputs.vanilla_url }}"
          
      - name: Download GAPPS
        run: |
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/gapps.img.xz" \
            "${{ steps.fetch.outputs.gapps_url }}"
          
      - name: Extract VANILLA
        run: |
          VANILLA_OUT="${{ env.WORK_DIR }}/extracted/vanilla"
          mkdir -p "$VANILLA_OUT"
    
          xz -d "${{ env.WORK_DIR }}/downloads/vanilla.img.xz"
          set +e
          7z x "${{ env.WORK_DIR }}/downloads/vanilla.img" -o"$VANILLA_OUT"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi
          echo "VANILLA_EXTRACTED=$VANILLA_OUT" >> $GITHUB_ENV

      - name: Extract GAPPS
        run: |
          GAPPS_OUT="${{ env.WORK_DIR }}/extracted/gapps"
          mkdir -p "$GAPPS_OUT"
    
          xz -d "${{ env.WORK_DIR }}/downloads/gapps.img.xz"
          set +e
          7z x "${{ env.WORK_DIR }}/downloads/gapps.img" -o"$GAPPS_OUT"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi
          echo "GAPPS_EXTRACTED=$GAPPS_OUT" >> $GITHUB_ENV

      - name: Generate file lists and diff
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          find vanilla -type f | sort > ${{ env.WORK_DIR }}/vanilla_files.txt
          find gapps -type f | sort > ${{ env.WORK_DIR }}/gapps_files.txt
          find vanilla -type d | sort > ${{ env.WORK_DIR }}/vanilla_dirs.txt
          find gapps -type d | sort > ${{ env.WORK_DIR }}/gapps_dirs.txt
          
          diff -qr vanilla gapps > ${{ env.WORK_DIR }}/full_diff.txt 2>&1 || true
          grep -E '(system/|system_ext/|product/)' ${{ env.WORK_DIR }}/full_diff.txt | grep -v 'build\.prop' > ${{ env.WORK_DIR }}/filtered_diff.txt || true
          
          echo "Generated all file lists and diffs"

      - name: Generate comparison report
        run: |
          {
            echo "# GSI Image Comparison: VANILLA vs GAPPS"
            echo ""
            echo "Release: ${{ steps.fetch.outputs.release_tag }}"
            echo "Comparison date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## Filtered differences (system/, system_ext/, product/ - no build.prop)"
            echo '```diff'
            cat ${{ env.WORK_DIR }}/filtered_diff.txt
            echo '```'
          } > ${{ env.WORK_DIR }}/comparison_report.md

      - name: Generate gapps-to-vanilla recovery ZIP
        id: generate_zip
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          ZIP_DIR="${{ env.WORK_DIR }}/gapps_to_vanilla_zip"
          mkdir -p "$ZIP_DIR/system" "$ZIP_DIR/system_ext" "$ZIP_DIR/product"
          
          # Files only in GAPPS (need to delete)
          comm -13 ${{ env.WORK_DIR }}/vanilla_files.txt ${{ env.WORK_DIR }}/gapps_files.txt | \
            grep -E '^(system/|system_ext/|product/)' | grep -v 'build\.prop' > ${{ env.WORK_DIR }}/gapps_only_files.txt
          
          # Files only in VANILLA (need to restore)
          comm -23 ${{ env.WORK_DIR }}/vanilla_files.txt ${{ env.WORK_DIR }}/gapps_files.txt | \
            grep -E '^(system/|system_ext/|product/)' | grep -v 'build\.prop' > ${{ env.WORK_DIR }}/vanilla_only_files.txt
          
          # Files that differ between versions
          grep "differ" ${{ env.WORK_DIR }}/full_diff.txt | \
            grep -E '(system/|system_ext/|product/)' | grep -v 'build\.prop' | \
            awk '{print $2}' | sed 's/^vanilla\///' > ${{ env.WORK_DIR }}/different_files.txt
          
          echo "Copying vanilla files for restoration..."
          VANILLA_COUNT=0
          while IFS= read -r file; do
            if [[ -f "vanilla/$file" ]]; then
              TARGET_DIR=$(dirname "$ZIP_DIR/$file")
              mkdir -p "$TARGET_DIR"
              cp "vanilla/$file" "$ZIP_DIR/$file"
              VANILLA_COUNT=$((VANILLA_COUNT + 1))
            fi
          done < ${{ env.WORK_DIR }}/vanilla_only_files.txt
          echo "  Vanilla-only files: $VANILLA_COUNT"
          
          DIFF_COUNT=0
          while IFS= read -r file; do
            if [[ -f "vanilla/$file" ]]; then
              TARGET_DIR=$(dirname "$ZIP_DIR/$file")
              mkdir -p "$TARGET_DIR"
              cp "vanilla/$file" "$ZIP_DIR/$file"
              DIFF_COUNT=$((DIFF_COUNT + 1))
            fi
          done < ${{ env.WORK_DIR }}/different_files.txt
          echo "  Modified files: $DIFF_COUNT"
          
          # Create delete list
          echo "Creating delete list..."
          while IFS= read -r file; do
            RELATIVE_PATH=$(echo "$file" | sed 's/^gapps\///')
            echo "/$RELATIVE_PATH" >> "$ZIP_DIR/delete.list"
          done < ${{ env.WORK_DIR }}/gapps_only_files.txt
          DELETE_COUNT=$(wc -l < "$ZIP_DIR/delete.list")
          echo "  Files to delete: $DELETE_COUNT"
          
          # Create META-INF directory and copy scripts from repository
          mkdir -p "$ZIP_DIR/META-INF/com/google/android"
          cp "${{ github.workspace }}/scripts/update-binary" "$ZIP_DIR/META-INF/com/google/android/update-binary"
          cp "${{ github.workspace }}/scripts/updater-script" "$ZIP_DIR/META-INF/com/google/android/updater-script"
          chmod +x "$ZIP_DIR/META-INF/com/google/android/update-binary"
          
          # Get release tag and create ZIP
          RELEASE_TAG="${{ steps.fetch.outputs.release_tag }}"
          ZIP_NAME="gapps-to-vanilla-${RELEASE_TAG}.zip"
          
          cd "$ZIP_DIR"
          zip -r "${{ env.WORK_DIR }}/${ZIP_NAME}" . -x "*.git*"
          
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "zip_path=${{ env.WORK_DIR }}/${ZIP_NAME}" >> $GITHUB_OUTPUT
          
          echo "Created recovery ZIP: ${ZIP_NAME}"
          echo ""
          echo "ZIP contents summary:"
          echo "  AOSP files to restore: $((VANILLA_COUNT + DIFF_COUNT))"
          echo "  GAPPS files to delete: $DELETE_COUNT"

      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report-${{ steps.fetch.outputs.release_tag }}
          path: |
            ${{ env.WORK_DIR }}/comparison_report.md
            ${{ env.WORK_DIR }}/filtered_diff.txt
            ${{ env.WORK_DIR }}/full_diff.txt
          retention-days: 30

      - name: Upload recovery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate_zip.outputs.zip_name }}
          path: ${{ steps.generate_zip.outputs.zip_path }}
          retention-days: 30

      - name: Display summary
        run: |
          {
            echo "## Comparison Complete"
            echo ""
            echo "**Release:** ${{ steps.fetch.outputs.release_tag }}"
            echo ""
            echo "### Artifacts"
            echo "| Artifact | Description |"
            echo "|----------|-------------|"
            echo "| comparison-report-${{ steps.fetch.outputs.release_tag }} | Full comparison report with filtered diff |"
            echo "| ${{ steps.generate_zip.outputs.zip_name }} | Recovery-flashable ZIP to restore VANILLA |"
            echo ""
            echo "### Usage"
            echo "1. Download ${{ steps.generate_zip.outputs.zip_name }}"
            echo "2. Flash via TWRP/OrangeFox recovery"
            echo "3. Reboot system"
          } >> $GITHUB_STEP_SUMMARY
