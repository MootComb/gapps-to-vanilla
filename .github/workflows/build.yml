name: GSI Release Monitor

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 3.9, leave empty for latest)'
        required: false
        type: string
        default: ''
      source_api_url:
        description: 'GitHub API URL for releases (leave empty for default)'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 */6 * * *'

env:
  DEFAULT_API_URL: "https://api.github.com/repos/Doze-off/ProjectInfinity-X_gsi/releases"
  WORK_DIR: ${{ github.workspace }}/gsi_work

permissions:
  contents: read

jobs:
  check_and_compare:
    name: Check release and compare images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/*
          sparse-checkout-cone-mode: false

      - name: Set API URL
        id: set_api
        run: |
          if [[ -n "${{ github.event.inputs.source_api_url }}" ]]; then
            echo "api_url=${{ github.event.inputs.source_api_url }}" >> $GITHUB_OUTPUT
          else
            echo "api_url=${{ env.DEFAULT_API_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils p7zip-full jq curl zip

      - name: Fetch releases
        id: fetch
        run: |
          mkdir -p ${{ env.WORK_DIR }}
          curl -fsSL "${{ steps.set_api.outputs.api_url }}" -o "${{ env.WORK_DIR }}/releases.json"
          
          TARGET_VERSION="${{ github.event.inputs.release_version }}"
          
          if [[ -z "$TARGET_VERSION" ]]; then
            LATEST_RELEASE=$(jq -r '.[0]' "${{ env.WORK_DIR }}/releases.json")
          else
            LATEST_RELEASE=$(jq --arg ver "$TARGET_VERSION" '
              map(select(.name | test($ver; "i"))) | 
              sort_by(.published_at) | 
              reverse | 
              .[0]
            ' "${{ env.WORK_DIR }}/releases.json")
            
            if [[ "$LATEST_RELEASE" == "null" || -z "$LATEST_RELEASE" ]]; then
              echo "::error::Version $TARGET_VERSION not found"
              echo "Available releases:"
              jq -r '.[] | "\(.tag_name) - \(.name)"' "${{ env.WORK_DIR }}/releases.json"
              exit 1
            fi
          fi
          
          if [[ "$LATEST_RELEASE" == "null" ]]; then
            echo "::error::No releases found"
            exit 1
          fi
          
          RELEASE_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          RELEASE_NAME=$(echo "$LATEST_RELEASE" | jq -r '.name')
          RELEASE_DATE=$(echo "$LATEST_RELEASE" | jq -r '.published_at')
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          
          VANILLA_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("VANILLA"; "i")) | .browser_download_url' | head -1)
          GAPPS_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("GAPPS"; "i")) | .browser_download_url' | head -1)
          
          if [[ -z "$VANILLA_URL" || -z "$GAPPS_URL" ]]; then
            echo "::error::Required assets not found"
            exit 1
          fi
          
          echo "vanilla_url=$VANILLA_URL" >> $GITHUB_OUTPUT
          echo "gapps_url=$GAPPS_URL" >> $GITHUB_OUTPUT
          
          echo "Selected: $RELEASE_NAME ($RELEASE_TAG)"
          
      - name: Download VANILLA
        run: |
          mkdir -p ${{ env.WORK_DIR }}/downloads
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/vanilla.img.xz" \
            "${{ steps.fetch.outputs.vanilla_url }}"
          
      - name: Download GAPPS
        run: |
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/gapps.img.xz" \
            "${{ steps.fetch.outputs.gapps_url }}"
          
      - name: Extract VANILLA
        run: |
          VANILLA_OUT="${{ env.WORK_DIR }}/extracted/vanilla"
          mkdir -p "$VANILLA_OUT"
          xz -d "${{ env.WORK_DIR }}/downloads/vanilla.img.xz"
          set +e
          7z x "${{ env.WORK_DIR }}/downloads/vanilla.img" -o"$VANILLA_OUT"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi
          echo "VANILLA_EXTRACTED=$VANILLA_OUT" >> $GITHUB_ENV

      - name: Extract GAPPS
        run: |
          GAPPS_OUT="${{ env.WORK_DIR }}/extracted/gapps"
          mkdir -p "$GAPPS_OUT"
          xz -d "${{ env.WORK_DIR }}/downloads/gapps.img.xz"
          set +e
          7z x "${{ env.WORK_DIR }}/downloads/gapps.img" -o"$GAPPS_OUT"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi
          echo "GAPPS_EXTRACTED=$GAPPS_OUT" >> $GITHUB_ENV

      - name: Generate file lists and diff
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          # Follow symlinks to avoid duplicate paths, then sort unique
          find -L vanilla -type f 2>/dev/null | sed 's|^vanilla/||' | sort -u > ${{ env.WORK_DIR }}/vanilla_files.txt
          find -L gapps -type f 2>/dev/null | sed 's|^gapps/||' | sort -u > ${{ env.WORK_DIR }}/gapps_files.txt
          
          echo "VANILLA files: $(wc -l < ${{ env.WORK_DIR }}/vanilla_files.txt)"
          echo "GAPPS files: $(wc -l < ${{ env.WORK_DIR }}/gapps_files.txt)"
          
          # Generate full diff (recursive, brief)
          diff -qr vanilla gapps 2>&1 | grep -v 'No such file or directory' > ${{ env.WORK_DIR }}/full_diff.txt || true
          
          echo "Full diff lines: $(wc -l < ${{ env.WORK_DIR }}/full_diff.txt)"
          echo "Only in gapps: $(grep -c '^Only in gapps' ${{ env.WORK_DIR }}/full_diff.txt || echo 0)"
          echo "Only in vanilla: $(grep -c '^Only in vanilla' ${{ env.WORK_DIR }}/full_diff.txt || echo 0)"
          echo "Differ: $(grep -c '^Files.*differ' ${{ env.WORK_DIR }}/full_diff.txt || echo 0)"
          
          # Filtered diff for report (exclude build.prop)
          grep -E '(system/|system_ext/|product/)' ${{ env.WORK_DIR }}/full_diff.txt | \
            grep -v 'build\.prop' > ${{ env.WORK_DIR }}/filtered_diff.txt || true
            
          echo ""
          echo "=== FULL DIFF (first 80 lines) ==="
          head -80 ${{ env.WORK_DIR }}/full_diff.txt

      - name: Generate comparison report
        run: |
          CURRENT_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          cat > ${{ env.WORK_DIR }}/comparison_report.md << EOF
          # GSI Image Comparison: VANILLA vs GAPPS
          
          **Release:** ${{ steps.fetch.outputs.release_name }}
          **Tag:** ${{ steps.fetch.outputs.release_tag }}
          **Published:** ${{ steps.fetch.outputs.release_date }}
          **Comparison date:** ${CURRENT_DATE}
          
          ---
          
          ## Filtered structural differences
          
          Filter: Only \`system/\`, \`system_ext/\`, \`product/\` - excluding \`build.prop\`
          
          \`\`\`diff
          $(cat ${{ env.WORK_DIR }}/filtered_diff.txt)
          \`\`\`
          
          ---
          
          ## Complete diff
          
          \`\`\`diff
          $(cat ${{ env.WORK_DIR }}/full_diff.txt)
          \`\`\`
          EOF

      - name: Generate gapps-to-vanilla recovery ZIP
        id: generate_zip
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          ZIP_DIR="${{ env.WORK_DIR }}/gapps_to_vanilla_zip"
          mkdir -p "$ZIP_DIR/system" "$ZIP_DIR/system_ext" "$ZIP_DIR/product"
          
          echo "=== PARSING DIFF ==="
          
          # Files only in GAPPS -> DELETE
          grep '^Only in gapps' ${{ env.WORK_DIR }}/full_diff.txt | \
            sed 's/^Only in gapps: //' | sed 's/: /\//' | \
            grep -E '^(system/|system_ext/|product/)' | \
            grep -v 'build\.prop' | sort -u > ${{ env.WORK_DIR }}/gapps_only_files.txt
          echo "Files to DELETE: $(wc -l < ${{ env.WORK_DIR }}/gapps_only_files.txt)"
          
          # Files only in VANILLA -> RESTORE
          grep '^Only in vanilla' ${{ env.WORK_DIR }}/full_diff.txt | \
            sed 's/^Only in vanilla: //' | sed 's/: /\//' | \
            grep -E '^(system/|system_ext/|product/)' | \
            grep -v 'build\.prop' | sort -u > ${{ env.WORK_DIR }}/vanilla_only_files.txt
          echo "Files to RESTORE (vanilla-only): $(wc -l < ${{ env.WORK_DIR }}/vanilla_only_files.txt)"
          
          # Files that DIFFER -> REPLACE
          grep '^Files.*differ' ${{ env.WORK_DIR }}/full_diff.txt | \
            sed 's/^Files vanilla\///' | sed 's/ and .* differ//' | \
            grep -E '^(system/|system_ext/|product/)' | \
            grep -v 'build\.prop' | sort -u > ${{ env.WORK_DIR }}/different_files.txt
          echo "Files to REPLACE: $(wc -l < ${{ env.WORK_DIR }}/different_files.txt)"
          
          echo ""
          echo "=== FILES TO RESTORE ==="
          cat ${{ env.WORK_DIR }}/vanilla_only_files.txt
          echo ""
          echo "=== FILES TO REPLACE ==="
          cat ${{ env.WORK_DIR }}/different_files.txt
          echo ""
          echo "=== FILES TO DELETE ==="
          cat ${{ env.WORK_DIR }}/gapps_only_files.txt
          
          # COPY vanilla-only files
          echo ""
          echo "=== COPYING FILES ==="
          VANILLA_COUNT=0
          while IFS= read -r file; do
            if [[ -n "$file" && -f "vanilla/$file" ]]; then
              TARGET_DIR=$(dirname "$ZIP_DIR/$file")
              mkdir -p "$TARGET_DIR"
              cp "vanilla/$file" "$ZIP_DIR/$file"
              VANILLA_COUNT=$((VANILLA_COUNT + 1))
            fi
          done < ${{ env.WORK_DIR }}/vanilla_only_files.txt
          echo "Copied vanilla-only: $VANILLA_COUNT"
          
          # COPY different files
          DIFF_COUNT=0
          while IFS= read -r file; do
            if [[ -n "$file" && -f "vanilla/$file" ]]; then
              TARGET_DIR=$(dirname "$ZIP_DIR/$file")
              mkdir -p "$TARGET_DIR"
              cp "vanilla/$file" "$ZIP_DIR/$file"
              DIFF_COUNT=$((DIFF_COUNT + 1))
            fi
          done < ${{ env.WORK_DIR }}/different_files.txt
          echo "Copied different: $DIFF_COUNT"
          
          # CREATE delete list
          while IFS= read -r file; do
            if [[ -n "$file" ]]; then
              echo "/$file" >> "$ZIP_DIR/delete.list"
            fi
          done < ${{ env.WORK_DIR }}/gapps_only_files.txt
          DELETE_COUNT=$(wc -l < "$ZIP_DIR/delete.list" 2>/dev/null || echo 0)
          echo "Delete list: $DELETE_COUNT"
          
          # META-INF
          mkdir -p "$ZIP_DIR/META-INF/com/google/android"
          cp "${{ github.workspace }}/scripts/update-binary" "$ZIP_DIR/META-INF/com/google/android/update-binary"
          cp "${{ github.workspace }}/scripts/updater-script" "$ZIP_DIR/META-INF/com/google/android/updater-script"
          chmod +x "$ZIP_DIR/META-INF/com/google/android/update-binary"
          
          RELEASE_TAG="${{ steps.fetch.outputs.release_tag }}"
          ZIP_NAME="gapps-to-vanilla-${RELEASE_TAG}.zip"
          
          cd "$ZIP_DIR"
          zip -r "${{ env.WORK_DIR }}/${ZIP_NAME}" . -x "*.git*"
          
          ZIP_SIZE=$(du -h "${{ env.WORK_DIR }}/${ZIP_NAME}" | cut -f1)
          
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "zip_path=${{ env.WORK_DIR }}/${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "zip_size=$ZIP_SIZE" >> $GITHUB_OUTPUT
          
          echo ""
          echo "========================================="
          echo "ZIP: ${ZIP_NAME} (${ZIP_SIZE})"
          echo "Restore: $((VANILLA_COUNT + DIFF_COUNT)) files"
          echo "Delete: $DELETE_COUNT files"
          echo "========================================="

      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report-${{ steps.fetch.outputs.release_tag }}
          path: |
            ${{ env.WORK_DIR }}/comparison_report.md
            ${{ env.WORK_DIR }}/filtered_diff.txt
            ${{ env.WORK_DIR }}/full_diff.txt
          retention-days: 30

      - name: Upload recovery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate_zip.outputs.zip_name }}
          path: ${{ steps.generate_zip.outputs.zip_path }}
          retention-days: 30

      - name: Display summary
        run: |
          {
            echo "## GSI Comparison Complete"
            echo ""
            echo "**Release:** ${{ steps.fetch.outputs.release_name }}"
            echo "**Tag:** ${{ steps.fetch.outputs.release_tag }}"
            echo "**Published:** ${{ steps.fetch.outputs.release_date }}"
            echo ""
            echo "### Artifacts"
            echo "| Artifact | Description |"
            echo "|----------|-------------|"
            echo "| comparison-report-${{ steps.fetch.outputs.release_tag }} | Full comparison report |"
            echo "| ${{ steps.generate_zip.outputs.zip_name }} | Recovery ZIP (${{ steps.generate_zip.outputs.zip_size }}) |"
            echo ""
            echo "### Usage"
            echo "1. Download ${{ steps.generate_zip.outputs.zip_name }}"
            echo "2. Flash via TWRP/OrangeFox recovery"
            echo "3. Reboot system"
          } >> $GITHUB_STEP_SUMMARY
