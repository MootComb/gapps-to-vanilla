name: GSI Release Monitor

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 3.9, leave empty for latest)'
        required: false
        type: string
        default: ''
      source_api_url:
        description: 'GitHub API URL for releases (leave empty for default)'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 */6 * * *'

env:
  DEFAULT_API_URL: "https://api.github.com/repos/Doze-off/ProjectInfinity-X_gsi/releases"
  WORK_DIR: ${{ github.workspace }}/gsi_work

permissions:
  contents: read

jobs:
  check_and_compare:
    name: Check release and compare images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/*
          sparse-checkout-cone-mode: false

      - name: Set API URL
        id: set_api
        run: |
          if [[ -n "${{ github.event.inputs.source_api_url }}" ]]; then
            echo "api_url=${{ github.event.inputs.source_api_url }}" >> $GITHUB_OUTPUT
            echo "Using custom API URL: ${{ github.event.inputs.source_api_url }}"
          else
            echo "api_url=${{ env.DEFAULT_API_URL }}" >> $GITHUB_OUTPUT
            echo "Using default API URL: ${{ env.DEFAULT_API_URL }}"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils p7zip-full jq curl zip

      - name: Fetch releases
        id: fetch
        run: |
          mkdir -p ${{ env.WORK_DIR }}
          curl -fsSL "${{ steps.set_api.outputs.api_url }}" -o "${{ env.WORK_DIR }}/releases.json"
          
          TARGET_VERSION="${{ github.event.inputs.release_version }}"
          
          if [[ -z "$TARGET_VERSION" ]]; then
            LATEST_RELEASE=$(jq -r '.[0]' "${{ env.WORK_DIR }}/releases.json")
            echo "Using latest release"
          else
            echo "Searching for version: $TARGET_VERSION"
            LATEST_RELEASE=$(jq --arg ver "$TARGET_VERSION" '
              map(select(.name | test($ver; "i"))) | 
              sort_by(.published_at) | 
              reverse | 
              .[0]
            ' "${{ env.WORK_DIR }}/releases.json")
            
            if [[ "$LATEST_RELEASE" == "null" || -z "$LATEST_RELEASE" ]]; then
              echo "::error::Version $TARGET_VERSION not found in release names"
              echo ""
              echo "Available releases:"
              jq -r '.[] | "\(.tag_name) - \(.name)"' "${{ env.WORK_DIR }}/releases.json"
              exit 1
            fi
            
            MATCH_COUNT=$(jq --arg ver "$TARGET_VERSION" '[.[] | select(.name | test($ver; "i"))] | length' "${{ env.WORK_DIR }}/releases.json")
            echo "Found $MATCH_COUNT release(s) matching version $TARGET_VERSION, using latest"
          fi
          
          if [[ "$LATEST_RELEASE" == "null" ]]; then
            echo "::error::No releases found"
            exit 1
          fi
          
          RELEASE_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          RELEASE_NAME=$(echo "$LATEST_RELEASE" | jq -r '.name')
          RELEASE_DATE=$(echo "$LATEST_RELEASE" | jq -r '.published_at')
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          
          VANILLA_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("VANILLA"; "i")) | .browser_download_url' | head -1)
          GAPPS_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("GAPPS"; "i")) | .browser_download_url' | head -1)
          
          if [[ -z "$VANILLA_URL" || -z "$GAPPS_URL" ]]; then
            echo "::error::Required assets not found"
            echo "VANILLA: $VANILLA_URL"
            echo "GAPPS: $GAPPS_URL"
            exit 1
          fi
          
          echo "vanilla_url=$VANILLA_URL" >> $GITHUB_OUTPUT
          echo "gapps_url=$GAPPS_URL" >> $GITHUB_OUTPUT
          
          echo "Selected release: $RELEASE_NAME ($RELEASE_TAG)"
          echo "Published: $RELEASE_DATE"
          
      - name: Download VANILLA
        run: |
          mkdir -p ${{ env.WORK_DIR }}/downloads
          echo "Downloading VANILLA..."
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/vanilla.img.xz" \
            "${{ steps.fetch.outputs.vanilla_url }}"
          echo "VANILLA downloaded successfully"
          
      - name: Download GAPPS
        run: |
          echo "Downloading GAPPS..."
          curl -fL --retry 5 --retry-delay 3 -o "${{ env.WORK_DIR }}/downloads/gapps.img.xz" \
            "${{ steps.fetch.outputs.gapps_url }}"
          echo "GAPPS downloaded successfully"
          
      - name: Extract VANILLA
        run: |
          VANILLA_OUT="${{ env.WORK_DIR }}/extracted/vanilla"
          mkdir -p "$VANILLA_OUT"
          
          echo "Extracting VANILLA image..."
          xz -d "${{ env.WORK_DIR }}/downloads/vanilla.img.xz"
          set +e
          7z x "${{ env.WORK_DIR }}/downloads/vanilla.img" -o"$VANILLA_OUT"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi
          echo "VANILLA extracted successfully"
          echo "VANILLA_EXTRACTED=$VANILLA_OUT" >> $GITHUB_ENV

      - name: Extract GAPPS
        run: |
          GAPPS_OUT="${{ env.WORK_DIR }}/extracted/gapps"
          mkdir -p "$GAPPS_OUT"
          
          echo "Extracting GAPPS image..."
          xz -d "${{ env.WORK_DIR }}/downloads/gapps.img.xz"
          set +e
          7z x "${{ env.WORK_DIR }}/downloads/gapps.img" -o"$GAPPS_OUT"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi
          echo "GAPPS extracted successfully"
          echo "GAPPS_EXTRACTED=$GAPPS_OUT" >> $GITHUB_ENV

      - name: Generate file lists and full diff
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          echo "Generating file lists..."
          find vanilla -type f | sort > ${{ env.WORK_DIR }}/vanilla_files.txt
          find gapps -type f | sort > ${{ env.WORK_DIR }}/gapps_files.txt
          find vanilla -type d | sort > ${{ env.WORK_DIR }}/vanilla_dirs.txt
          find gapps -type d | sort > ${{ env.WORK_DIR }}/gapps_dirs.txt
          
          echo "VANILLA total files: $(wc -l < ${{ env.WORK_DIR }}/vanilla_files.txt)"
          echo "GAPPS total files: $(wc -l < ${{ env.WORK_DIR }}/gapps_files.txt)"
          
          echo "Generating full diff..."
          diff -qr vanilla gapps > ${{ env.WORK_DIR }}/full_diff.txt 2>&1 || true
          
          echo "Full diff lines: $(wc -l < ${{ env.WORK_DIR }}/full_diff.txt)"
          
          # Show diff summary
          echo ""
          echo "=== DIFF SUMMARY ==="
          echo "Only in vanilla: $(grep -c '^Only in vanilla' ${{ env.WORK_DIR }}/full_diff.txt || echo 0)"
          echo "Only in gapps: $(grep -c '^Only in gapps' ${{ env.WORK_DIR }}/full_diff.txt || echo 0)"
          echo "Differ: $(grep -c '^Files.*differ' ${{ env.WORK_DIR }}/full_diff.txt || echo 0)"
          
          # Full diff content for debugging
          echo ""
          echo "=== FULL DIFF (first 50 lines) ==="
          head -50 ${{ env.WORK_DIR }}/full_diff.txt
          echo "..."
          echo ""
          echo "=== ONLY IN GAPPS (first 30) ==="
          grep '^Only in gapps' ${{ env.WORK_DIR }}/full_diff.txt | head -30 || echo "None"
          echo ""
          echo "=== FILES THAT DIFFER (first 30) ==="
          grep '^Files.*differ' ${{ env.WORK_DIR }}/full_diff.txt | head -30 || echo "None"
          
          # Filtered diff for report (excluding build.prop)
          grep -E '(system/|system_ext/|product/)' ${{ env.WORK_DIR }}/full_diff.txt | grep -v 'build\.prop' > ${{ env.WORK_DIR }}/filtered_diff.txt || true
          echo ""
          echo "Filtered diff lines: $(wc -l < ${{ env.WORK_DIR }}/filtered_diff.txt)"

      - name: Generate comparison report
        run: |
          CURRENT_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          cat > ${{ env.WORK_DIR }}/comparison_report.md << EOF
          # GSI Image Comparison: VANILLA vs GAPPS
          
          **Release:** ${{ steps.fetch.outputs.release_name }}
          
          **Tag:** ${{ steps.fetch.outputs.release_tag }}
          
          **Published:** ${{ steps.fetch.outputs.release_date }}
          
          **Source:** ${{ steps.set_api.outputs.api_url }}
          
          **Comparison date:** ${CURRENT_DATE}
          
          ---
          
          ## Full diff (system/, system_ext/, product/ - excluding build.prop)
          
          \`\`\`diff
          $(cat ${{ env.WORK_DIR }}/filtered_diff.txt)
          \`\`\`
          
          ---
          
          ## Complete diff (all files)
          
          \`\`\`diff
          $(cat ${{ env.WORK_DIR }}/full_diff.txt)
          \`\`\`
          EOF

      - name: Generate gapps-to-vanilla recovery ZIP
        id: generate_zip
        run: |
          cd ${{ env.WORK_DIR }}/extracted
          
          ZIP_DIR="${{ env.WORK_DIR }}/gapps_to_vanilla_zip"
          mkdir -p "$ZIP_DIR/system" "$ZIP_DIR/system_ext" "$ZIP_DIR/product"
          
          echo "=== PROCESSING FULL DIFF ==="
          
          # 1. Files only in GAPPS -> need to DELETE
          echo ""
          echo "1. Finding files only in GAPPS (to delete)..."
          grep '^Only in gapps' ${{ env.WORK_DIR }}/full_diff.txt | \
            sed 's/Only in gapps: //' | \
            sed 's/: /\//' > ${{ env.WORK_DIR }}/gapps_only_raw.txt || touch ${{ env.WORK_DIR }}/gapps_only_raw.txt
          
          # Filter to keep only system/, system_ext/, product/ - exclude build.prop
          grep -E '^(system/|system_ext/|product/)' ${{ env.WORK_DIR }}/gapps_only_raw.txt | \
            grep -v 'build\.prop' > ${{ env.WORK_DIR }}/gapps_only_files.txt || touch ${{ env.WORK_DIR }}/gapps_only_files.txt
          
          GAPPS_ONLY_COUNT=$(wc -l < ${{ env.WORK_DIR }}/gapps_only_files.txt)
          echo "  Files to delete: $GAPPS_ONLY_COUNT"
          head -20 ${{ env.WORK_DIR }}/gapps_only_files.txt
          
          # 2. Files only in VANILLA -> need to RESTORE (copy from vanilla)
          echo ""
          echo "2. Finding files only in VANILLA (to restore)..."
          grep '^Only in vanilla' ${{ env.WORK_DIR }}/full_diff.txt | \
            sed 's/Only in vanilla: //' | \
            sed 's/: /\//' > ${{ env.WORK_DIR }}/vanilla_only_raw.txt || touch ${{ env.WORK_DIR }}/vanilla_only_raw.txt
          
          grep -E '^(system/|system_ext/|product/)' ${{ env.WORK_DIR }}/vanilla_only_raw.txt | \
            grep -v 'build\.prop' > ${{ env.WORK_DIR }}/vanilla_only_files.txt || touch ${{ env.WORK_DIR }}/vanilla_only_files.txt
          
          VANILLA_ONLY_COUNT=$(wc -l < ${{ env.WORK_DIR }}/vanilla_only_files.txt)
          echo "  Files to restore (vanilla only): $VANILLA_ONLY_COUNT"
          head -20 ${{ env.WORK_DIR }}/vanilla_only_files.txt
          
          # 3. Files that DIFFER -> need to REPLACE with vanilla version
          echo ""
          echo "3. Finding files that differ (to replace)..."
          grep '^Files.*differ' ${{ env.WORK_DIR }}/full_diff.txt | \
            sed 's/^Files //' | sed 's/ and .* differ//' | \
            sed 's/^vanilla\///' > ${{ env.WORK_DIR }}/different_raw.txt || touch ${{ env.WORK_DIR }}/different_raw.txt
          
          grep -E '^(system/|system_ext/|product/)' ${{ env.WORK_DIR }}/different_raw.txt | \
            grep -v 'build\.prop' > ${{ env.WORK_DIR }}/different_files.txt || touch ${{ env.WORK_DIR }}/different_files.txt
          
          DIFF_FILES_COUNT=$(wc -l < ${{ env.WORK_DIR }}/different_files.txt)
          echo "  Files to replace: $DIFF_FILES_COUNT"
          head -20 ${{ env.WORK_DIR }}/different_files.txt
          
          # COPY vanilla-only files
          echo ""
          echo "=== COPYING FILES ==="
          echo "Copying vanilla-only files..."
          VANILLA_COUNT=0
          if [[ -s ${{ env.WORK_DIR }}/vanilla_only_files.txt ]]; then
            while IFS= read -r file; do
              if [[ -n "$file" && -f "vanilla/$file" ]]; then
                TARGET_DIR=$(dirname "$ZIP_DIR/$file")
                mkdir -p "$TARGET_DIR"
                cp "vanilla/$file" "$ZIP_DIR/$file"
                VANILLA_COUNT=$((VANILLA_COUNT + 1))
              fi
            done < ${{ env.WORK_DIR }}/vanilla_only_files.txt
          fi
          echo "  Copied: $VANILLA_COUNT files"
          
          # COPY different files (replace with vanilla)
          echo "Copying modified files..."
          DIFF_COUNT=0
          if [[ -s ${{ env.WORK_DIR }}/different_files.txt ]]; then
            while IFS= read -r file; do
              if [[ -n "$file" && -f "vanilla/$file" ]]; then
                TARGET_DIR=$(dirname "$ZIP_DIR/$file")
                mkdir -p "$TARGET_DIR"
                cp "vanilla/$file" "$ZIP_DIR/$file"
                DIFF_COUNT=$((DIFF_COUNT + 1))
              fi
            done < ${{ env.WORK_DIR }}/different_files.txt
          fi
          echo "  Copied: $DIFF_COUNT files"
          
          # CREATE delete list
          echo ""
          echo "Creating delete list..."
          if [[ -s ${{ env.WORK_DIR }}/gapps_only_files.txt ]]; then
            while IFS= read -r file; do
              if [[ -n "$file" ]]; then
                echo "/$file" >> "$ZIP_DIR/delete.list"
              fi
            done < ${{ env.WORK_DIR }}/gapps_only_files.txt
            DELETE_COUNT=$(wc -l < "$ZIP_DIR/delete.list")
          else
            touch "$ZIP_DIR/delete.list"
            DELETE_COUNT=0
          fi
          echo "  Delete list entries: $DELETE_COUNT"
          head -20 "$ZIP_DIR/delete.list"
          
          # SHOW what's in the ZIP
          echo ""
          echo "=== ZIP CONTENTS PREVIEW ==="
          echo "Files in ZIP structure:"
          find "$ZIP_DIR" -type f -not -path "*/META-INF/*" | head -50
          
          # Create META-INF
          echo ""
          echo "=== CREATING ZIP ==="
          mkdir -p "$ZIP_DIR/META-INF/com/google/android"
          
          if [[ -f "${{ github.workspace }}/scripts/update-binary" ]]; then
            cp "${{ github.workspace }}/scripts/update-binary" "$ZIP_DIR/META-INF/com/google/android/update-binary"
            chmod +x "$ZIP_DIR/META-INF/com/google/android/update-binary"
          else
            echo "::error::scripts/update-binary not found"
            exit 1
          fi
          
          if [[ -f "${{ github.workspace }}/scripts/updater-script" ]]; then
            cp "${{ github.workspace }}/scripts/updater-script" "$ZIP_DIR/META-INF/com/google/android/updater-script"
          else
            echo "::error::scripts/updater-script not found"
            exit 1
          fi
          
          RELEASE_TAG="${{ steps.fetch.outputs.release_tag }}"
          ZIP_NAME="gapps-to-vanilla-${RELEASE_TAG}.zip"
          
          cd "$ZIP_DIR"
          zip -r "${{ env.WORK_DIR }}/${ZIP_NAME}" . -x "*.git*"
          
          ZIP_SIZE=$(du -h "${{ env.WORK_DIR }}/${ZIP_NAME}" | cut -f1)
          
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "zip_path=${{ env.WORK_DIR }}/${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "zip_size=$ZIP_SIZE" >> $GITHUB_OUTPUT
          
          echo ""
          echo "========================================="
          echo "Recovery ZIP created successfully!"
          echo "========================================="
          echo "File: ${ZIP_NAME}"
          echo "Size: ${ZIP_SIZE}"
          echo ""
          echo "Contents summary:"
          echo "  AOSP files to restore: $((VANILLA_COUNT + DIFF_COUNT))"
          echo "  GAPPS files to delete: $DELETE_COUNT"

      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report-${{ steps.fetch.outputs.release_tag }}
          path: |
            ${{ env.WORK_DIR }}/comparison_report.md
            ${{ env.WORK_DIR }}/filtered_diff.txt
            ${{ env.WORK_DIR }}/full_diff.txt
          retention-days: 30

      - name: Upload recovery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate_zip.outputs.zip_name }}
          path: ${{ steps.generate_zip.outputs.zip_path }}
          retention-days: 30

      - name: Display summary
        run: |
          {
            echo "## GSI Comparison Complete"
            echo ""
            echo "### Release Info"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Release | ${{ steps.fetch.outputs.release_name }} |"
            echo "| Tag | ${{ steps.fetch.outputs.release_tag }} |"
            echo "| Published | ${{ steps.fetch.outputs.release_date }} |"
            echo ""
            echo "### Generated Artifacts"
            echo "| Artifact | Description |"
            echo "|----------|-------------|"
            echo "| comparison-report-${{ steps.fetch.outputs.release_tag }} | Full comparison report |"
            echo "| ${{ steps.generate_zip.outputs.zip_name }} | Recovery-flashable ZIP (${{ steps.generate_zip.outputs.zip_size }}) |"
            echo ""
            echo "### How to use"
            echo "1. Download ${{ steps.generate_zip.outputs.zip_name }}"
            echo "2. Boot into TWRP/OrangeFox recovery"
            echo "3. Flash the ZIP"
            echo "4. Reboot system"
          } >> $GITHUB_STEP_SUMMARY
